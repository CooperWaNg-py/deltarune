<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Deltarune Web Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <iframe id="chapterFrame" title="Deltarune Chapter" allowfullscreen></iframe>

  <button id="backBtn" class="back-btn" aria-label="Back to menu">&#9664; Menu</button>

  <div class="logo-container" id="logoContainer">
    <img src="logo.png" alt="Deltarune Logo" class="logo">
  </div>

  <nav class="menu" id="mainMenu" role="navigation" aria-label="Chapter selection">
    <a href="javascript:void(0)" onclick="loadChapter(1)" class="row" role="button" tabindex="0" aria-label="Chapter 1 The Beginning">
      <span class="chapter">Chapter 1</span>
      <span class="title">The Beginning</span>
      <img src="icons/1.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="loadChapter(2)" class="row" role="button" tabindex="0" aria-label="Chapter 2 A Cyber's World">
      <span class="chapter">Chapter 2</span>
      <span class="title">A Cyber's World</span>
      <img src="icons/2.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="loadChapter(3)" class="row" role="button" tabindex="0" aria-label="Chapter 3 Late Night">
      <span class="chapter">Chapter 3</span>
      <span class="title">Late Night</span>
      <img src="icons/3.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="loadChapter(4)" class="row" role="button" tabindex="0" aria-label="Chapter 4 Prophecy">
      <span class="chapter">Chapter 4</span>
      <span class="title">Prophecy</span>
      <img src="icons/4.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="alert('Chapter 5 coming soon!')" class="disabled-row" role="button" aria-disabled="true" tabindex="-1" aria-label="Chapter 5 coming soon">
      <span class="chapter">Chapter 5</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="alert('Chapter 6 coming soon!')" class="disabled-row" role="button" aria-disabled="true" tabindex="-1" aria-label="Chapter 6 coming soon">
      <span class="chapter">Chapter 6</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="alert('Chapter 7 coming soon!')" class="disabled-row" role="button" aria-disabled="true" tabindex="-1" aria-label="Chapter 7 coming soon">
      <span class="chapter">Chapter 7</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png" alt="" loading="lazy">
    </a>
  </nav>

  <audio id="drone" loop autoplay hidden>
    <source src="audios/AUDIO_DRONE.ogg" type="audio/ogg">
  </audio>
  <button id="mute" aria-label="Toggle menu music">&#128266;</button>

  <script>
    (function() {
      const audio = document.getElementById('drone');
      const mute = document.getElementById('mute');
      const backBtn = document.getElementById('backBtn');
      const iframe = document.getElementById('chapterFrame');
      const menu = document.getElementById('mainMenu');
      const logo = document.getElementById('logoContainer');
      let gamestarted = false;
      let selectedChapter = null;
      const rows = () => menu.querySelectorAll('.row');
      const origin = window.location.origin;

      function updateMuteButton() {
        mute.textContent = audio.muted ? '🔇' : '🔊';
      }
      updateMuteButton();

      mute.addEventListener('click', () => {
        if (!gamestarted) {
          audio.muted = !audio.muted;
          updateMuteButton();
        }
      });

      window.loadChapter = function(chapter) {
        if (gamestarted) return;
        menuselectaudio.play();
        gamestarted = true;

        menu.classList.add('hidden-menu');
        logo.classList.add('hidden-menu');
        mute.style.display = 'none';
        backBtn.style.display = 'block';

        iframe.src = 'chapter' + chapter + '/index.html';
        iframe.classList.add('active');

        iframe.onload = function() {
          iframe.contentWindow.focus();
        };
      };

      function backToMenu() {
        if (!gamestarted) return;
        iframe.classList.remove('active');
        iframe.src = 'about:blank';
        gamestarted = false;
        selectedChapter = null;
        rows().forEach(function(r) { r.classList.remove('selected'); });

        menu.classList.remove('hidden-menu');
        logo.classList.remove('hidden-menu');
        mute.style.display = 'block';
        backBtn.style.display = 'none';
        updateMuteButton();

        var first = rows()[0];
        if (first) first.focus();
      }
      backBtn.addEventListener('click', backToMenu);

      // Menu sounds
      var menumoveaudio = new Audio('audios/snd_menumove.mp3');
      var menuselectaudio = new Audio('audios/snd_select.mp3');

      rows().forEach(function(row) {
        row.addEventListener('mouseenter', function() {
          if (!gamestarted) {
            menumoveaudio.play();
            if (selectedChapter !== null && rows()[selectedChapter]) {
              rows()[selectedChapter].classList.remove('selected');
            }
            selectedChapter = Array.prototype.indexOf.call(rows(), row);
            row.classList.add('selected');
          }
        });
      });

      // Keyboard navigation
      document.addEventListener('keydown', function(event) {
        if (gamestarted) {
          if (event.key === 'Escape') {
            backToMenu();
            event.preventDefault();
            return;
          }
          iframe.contentWindow.postMessage({ type: 'keydown', key: event.key }, origin);
          return;
        }

        if (event.key === 'ArrowUp') {
          event.preventDefault();
          if (selectedChapter === null) {
            selectedChapter = 0;
          } else {
            if (rows()[selectedChapter]) rows()[selectedChapter].classList.remove('selected');
            selectedChapter--;
            if (selectedChapter < 0) selectedChapter = rows().length - 1;
          }
          if (rows()[selectedChapter]) {
            rows()[selectedChapter].classList.add('selected');
            rows()[selectedChapter].focus();
          }
          menumoveaudio.play();
        } else if (event.key === 'ArrowDown') {
          event.preventDefault();
          if (selectedChapter === null) {
            selectedChapter = 0;
          } else {
            if (rows()[selectedChapter]) rows()[selectedChapter].classList.remove('selected');
            selectedChapter = (selectedChapter + 1) % rows().length;
          }
          if (rows()[selectedChapter]) {
            rows()[selectedChapter].classList.add('selected');
            rows()[selectedChapter].focus();
          }
          menumoveaudio.play();
        } else if (event.key === 'Enter') {
          if (selectedChapter !== null && rows()[selectedChapter]) {
            rows()[selectedChapter].click();
          }
        }
      });

      document.addEventListener('keyup', function(e) {
        if (gamestarted) {
          iframe.contentWindow.postMessage({ type: 'keyup', key: e.key }, origin);
        }
      });
    })();
  </script>
</body>
</html>
