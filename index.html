<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Deltarune Web Launcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <iframe id="chapterFrame" title="Deltarune Chapter" allowfullscreen></iframe>

  <button id="backBtn" class="back-btn" aria-label="Back to menu">&#9664; Menu</button>

  <div class="logo-container" id="logoContainer">
    <img src="logo.png" alt="Deltarune Logo" class="logo">
  </div>

  <nav class="menu" id="mainMenu" role="navigation" aria-label="Chapter selection">
    <a href="javascript:void(0)" onclick="loadChapter(1)" class="row" role="button" tabindex="0" aria-label="Chapter 1 The Beginning">
      <span class="chapter">Chapter 1</span>
      <span class="title">The Beginning</span>
      <img src="icons/1.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="loadChapter(2)" class="row" role="button" tabindex="0" aria-label="Chapter 2 A Cyber's World">
      <span class="chapter">Chapter 2</span>
      <span class="title">A Cyber's World</span>
      <img src="icons/2.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="loadChapter(3)" class="row" role="button" tabindex="0" aria-label="Chapter 3 Late Night">
      <span class="chapter">Chapter 3</span>
      <span class="title">Late Night</span>
      <img src="icons/3.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="loadChapter(4)" class="row" role="button" tabindex="0" aria-label="Chapter 4 Prophecy">
      <span class="chapter">Chapter 4</span>
      <span class="title">Prophecy</span>
      <img src="icons/4.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="alert('Chapter 5 coming soon!')" class="disabled-row" role="button" aria-disabled="true" tabindex="-1" aria-label="Chapter 5 coming soon">
      <span class="chapter">Chapter 5</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="alert('Chapter 6 coming soon!')" class="disabled-row" role="button" aria-disabled="true" tabindex="-1" aria-label="Chapter 6 coming soon">
      <span class="chapter">Chapter 6</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="alert('Chapter 7 coming soon!')" class="disabled-row" role="button" aria-disabled="true" tabindex="-1" aria-label="Chapter 7 coming soon">
      <span class="chapter">Chapter 7</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png" alt="" loading="lazy">
    </a>
  </nav>

  <div id="versionTag"></div>

  <audio id="drone" loop hidden>
    <source src="audios/AUDIO_DRONE.ogg" type="audio/ogg">
    <source src="audios/AUDIO_DRONE.mp3" type="audio/mpeg">
  </audio>
  <button id="settingsBtn" aria-label="Settings" title="Settings">&#9881;</button>
  <button id="savesBtn" aria-label="Manage save files" title="Manage save files">&#128190;</button>
  <button id="mute" aria-label="Toggle menu music">&#128266;</button>

  <div id="settingsPanel" class="settings-panel" hidden>
    <div class="settings-row">
      <span class="settings-label">Game Speed</span>
      <div class="settings-slider-row">
        <span class="settings-slider-label">0.25&#215;</span>
        <input type="range" id="speedSlider" min="0.25" max="5" step="0.25" value="1">
        <span class="settings-slider-label" id="speedValue">1.0&#215;</span>
      </div>
    </div>
    <div class="settings-row" style="margin-top:10px">
      <span class="settings-label">Volume</span>
      <div class="settings-slider-row">
        <span class="settings-slider-label">0%</span>
        <input type="range" id="volumeSlider" min="0" max="100" step="5" value="100">
        <span class="settings-slider-label" id="volumeValue">100%</span>
      </div>
    </div>
    <div class="settings-row" style="margin-top:10px">
      <button id="fullscreenBtn" class="settings-btn">Fullscreen</button>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Saves Modal -->
  <div id="savesModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="savesModalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="savesModalTitle">Save Files</h2>
        <button id="closeSavesBtn" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div id="cloudRow" class="cloud-row">
        <input type="text" id="cloudId" placeholder="Cloud ID (e.g. player1)" class="cloud-input">
        <button id="uploadBtn" class="cloud-btn">&#9729; Upload</button>
        <button id="downloadBtn" class="cloud-btn">&#9729; Download</button>
      </div>
      <div class="modal-body">
        <div id="savesWarning" class="saves-warning" hidden>Game is running — avoid editing while the game is saving.</div>
        <div class="saves-search-row">
          <input type="text" id="savesSearch" class="saves-search" placeholder="Filter filenames..." spellcheck="false">
          <span id="savesCount" class="saves-count"></span>
        </div>
        <div id="savesList" class="saves-list"></div>
        <div id="saveEditor" class="save-editor" hidden>
          <div class="editor-header">
            <button id="editorBack" class="editor-back-btn">&#9664; Back</button>
            <span id="editorFilename" class="editor-filename"></span>
          </div>
          <textarea id="editorTextarea" spellcheck="false" autocomplete="off"></textarea>
          <div id="hexPreview" class="hex-preview" hidden></div>
          <div class="editor-actions">
            <button id="editorSave" class="btn-primary">Save Changes</button>
            <button id="editorDelete" class="btn-danger">Delete File</button>
            <button id="editorRestoreBackup" class="btn-restore" hidden>Restore from Backup</button>
            <button id="editorGoOriginal" class="btn-restore" hidden>Go to Original</button>
          </div>
        </div>
      </div>
      <div class="modal-footer" id="savesModalFooter">
        <button id="tennaBtn">Tenna Editor</button>
        <button id="exportSavesBtn">Export All</button>
        <button id="importSavesBtn">Import</button>
        <input type="file" id="importInput" accept=".json,application/json" hidden>
        <button id="clearBackupsBtn">Clear Backups</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const audio = document.getElementById('drone');
      const mute = document.getElementById('mute');
      const savesBtn = document.getElementById('savesBtn');
      const backBtn = document.getElementById('backBtn');
      const iframe = document.getElementById('chapterFrame');
      const menu = document.getElementById('mainMenu');
      const logo = document.getElementById('logoContainer');
      let gamestarted = false;
      let backTimer = null;
      window.__launcher = { isGameStarted: () => gamestarted };
      let selectedChapter = null;
      const rows = () => menu.querySelectorAll('.row');
      const origin = window.location.origin;
      const SPEED_KEY = 'deltarune_speed';
      const settingsBtn = document.getElementById('settingsBtn');
      const settingsPanel = document.getElementById('settingsPanel');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const versionTag = document.getElementById('versionTag');
      versionTag.textContent = 'v0.2.1 (' + new Date(document.lastModified).toISOString().split('T')[0] + ')';

      function getSpeed() { var v = parseFloat(localStorage.getItem(SPEED_KEY)); return (isFinite(v) && v > 0) ? v : 1; }
      function setSpeed(v) {
        v = Math.round(v / 0.25) * 0.25;
        v = Math.max(0.25, Math.min(5, v));
        localStorage.setItem(SPEED_KEY, String(v));
        speedSlider.value = v;
        speedValue.textContent = (v < 1 ? v.toFixed(2) : v.toFixed(1)) + '\u00d7';
      }
      function syncSpeedFromStorage() { setSpeed(getSpeed()); }
      speedSlider.addEventListener('input', function() { setSpeed(parseFloat(this.value)); });

      function openSettings() {
        settingsPanel.hidden = false;
        syncSpeedFromStorage();
        speedSlider.focus();
      }
      function closeSettings() { settingsPanel.hidden = true; }
      settingsBtn.addEventListener('click', function(e) {
        if (settingsPanel.hidden) openSettings();
      });
      document.addEventListener('click', function(e) {
        if (!settingsPanel.hidden && !settingsBtn.contains(e.target) && !settingsPanel.contains(e.target)) {
          closeSettings();
        }
      });

      var volumeSlider = document.getElementById('volumeSlider');
      var volumeValue = document.getElementById('volumeValue');
      var VOLUME_KEY = 'deltarune_volume';
      function getVolume() { var v = parseFloat(localStorage.getItem(VOLUME_KEY)); return isFinite(v) ? Math.max(0, Math.min(100, v)) : 100; }
      function setVolume(v) {
        v = Math.round(Math.max(0, Math.min(100, v)));
        localStorage.setItem(VOLUME_KEY, String(v));
        volumeSlider.value = v;
        volumeValue.textContent = v + '%';
        if (gamestarted) {
          try { iframe.contentWindow.postMessage({ type: 'volume', volume: v / 100 }, origin); } catch(e) {}
        }
      }
      volumeSlider.addEventListener('input', function() { setVolume(parseFloat(this.value)); });
      setVolume(getVolume());

      var fullscreenBtn = document.getElementById('fullscreenBtn');
      fullscreenBtn.addEventListener('click', function() {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(function(){});
        } else if (iframe.requestFullscreen) {
          iframe.requestFullscreen().catch(function(){});
        }
      });

      function updateMuteButton() {
        mute.textContent = audio.muted ? '🔇' : '🔊';
      }
      updateMuteButton();

      // Start menu drone on first user interaction (replaces removed autoplay)
      var droneStarted = false;
      function startDrone() {
        if (droneStarted) return;
        droneStarted = true;
        audio.play().catch(function(){});
        document.removeEventListener('click', startDrone);
        document.removeEventListener('keydown', startDrone);
      }
      document.addEventListener('click', startDrone);
      document.addEventListener('keydown', startDrone);

      mute.addEventListener('click', () => {
        if (!gamestarted) {
          audio.muted = !audio.muted;
          updateMuteButton();
        }
      });

      function toast(msg, duration) {
        duration = duration || 3000;
        var el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        var c = document.getElementById('toastContainer');
        if (!c) return;
        c.appendChild(el);
        setTimeout(function() { el.classList.add('toast-hide'); setTimeout(function() { el.remove(); }, 300); }, duration);
      }
      window.__launcher.toast = toast;

      window.loadChapter = function(chapter) {
        if (gamestarted) return;
        if (backTimer) { clearTimeout(backTimer); backTimer = null; }
        menuselectaudio.play().catch(function(){});
        gamestarted = true;

        menu.classList.add('hidden-menu');
        logo.classList.add('hidden-menu');
        mute.style.display = 'none';
        settingsBtn.style.display = 'block';
        backBtn.style.display = 'block';
        versionTag.style.display = 'none';

        iframe.src = 'chapter' + chapter + '/index.html';
        iframe.classList.add('active');

        iframe.onload = function() {
          iframe.contentWindow.focus();
          setVolume(getVolume());
        };
      };

      function backToMenu() {
        if (!gamestarted) return;
        iframe.classList.remove('active');
        if (backTimer) clearTimeout(backTimer);
        backTimer = setTimeout(function() {
          iframe.src = 'about:blank';
          backTimer = null;
        }, 500);
        gamestarted = false;
        selectedChapter = null;
        rows().forEach(function(r) { r.classList.remove('selected'); });

        menu.classList.remove('hidden-menu');
        logo.classList.remove('hidden-menu');
        mute.style.display = 'block';
        settingsBtn.style.display = 'none';
        closeSettings();
        backBtn.style.display = 'none';
        versionTag.style.display = 'block';
        updateMuteButton();

        var first = rows()[0];
        if (first) first.focus();
      }
      backBtn.addEventListener('click', backToMenu);

      // Menu sounds
      var menumoveaudio = new Audio('audios/snd_menumove.mp3');
      var menuselectaudio = new Audio('audios/snd_select.mp3');

      rows().forEach(function(row) {
        row.addEventListener('mouseenter', function() {
          if (!gamestarted) {
            menumoveaudio.play().catch(function(){});
            if (selectedChapter !== null && rows()[selectedChapter]) {
              rows()[selectedChapter].classList.remove('selected');
            }
            selectedChapter = Array.prototype.indexOf.call(rows(), row);
            row.classList.add('selected');
          }
        });
      });

      // Keyboard navigation
      document.addEventListener('keydown', function(event) {
        if (gamestarted) {
          if (event.key === 'Escape') {
            if (!settingsPanel.hidden) {
              closeSettings();
              event.preventDefault();
              return;
            }
            backToMenu();
            event.preventDefault();
            return;
          }
          if (event.key === '[') { setSpeed(getSpeed() - 0.25); event.preventDefault(); return; }
          if (event.key === ']') { setSpeed(getSpeed() + 0.25); event.preventDefault(); return; }
          if (event.key === '\\') { setSpeed(1); event.preventDefault(); return; }
          try { iframe.contentWindow.postMessage({ type: 'keydown', key: event.key }, origin); } catch(e) {}
          return;
        }

        if (event.key === 'ArrowUp') {
          event.preventDefault();
          if (selectedChapter === null) {
            selectedChapter = 0;
          } else {
            if (rows()[selectedChapter]) rows()[selectedChapter].classList.remove('selected');
            selectedChapter--;
            if (selectedChapter < 0) selectedChapter = rows().length - 1;
          }
          if (rows()[selectedChapter]) {
            rows()[selectedChapter].classList.add('selected');
            rows()[selectedChapter].focus();
          }
          menumoveaudio.play().catch(function(){});
        } else if (event.key === 'ArrowDown') {
          event.preventDefault();
          if (selectedChapter === null) {
            selectedChapter = 0;
          } else {
            if (rows()[selectedChapter]) rows()[selectedChapter].classList.remove('selected');
            selectedChapter = (selectedChapter + 1) % rows().length;
          }
          if (rows()[selectedChapter]) {
            rows()[selectedChapter].classList.add('selected');
            rows()[selectedChapter].focus();
          }
          menumoveaudio.play().catch(function(){});
        } else if (event.key === 'Enter') {
          if (selectedChapter !== null && rows()[selectedChapter]) {
            rows()[selectedChapter].click();
          }
        }
      });

      document.addEventListener('keyup', function(e) {
        if (gamestarted) {
          try { iframe.contentWindow.postMessage({ type: 'keyup', key: e.key }, origin); } catch(e) {}
        }
      });
    })();
  </script>

  <script>
    // Save file manager: reads/writes the GameMaker IDBFS database (/_savedata)
    (function() {
      const DB_NAME = '/_savedata';
      const STORE = 'FILE_DATA';

      if (indexedDB.databases) {
        indexedDB.databases().then(function(dbs) {
          console.log('[Saves] Available databases:', dbs.map(function(d) { return d.name + ' v' + d.version; }));
        });
      }

      const savesBtn = document.getElementById('savesBtn');
      const savesModal = document.getElementById('savesModal');
      const closeSavesBtn = document.getElementById('closeSavesBtn');
      const savesList = document.getElementById('savesList');
      const savesWarning = document.getElementById('savesWarning');
      const saveEditor = document.getElementById('saveEditor');
      const editorFilename = document.getElementById('editorFilename');
      const editorBack = document.getElementById('editorBack');
      const editorTextarea = document.getElementById('editorTextarea');
      const editorSave = document.getElementById('editorSave');
      const editorDelete = document.getElementById('editorDelete');
      const editorRestoreBackup = document.getElementById('editorRestoreBackup');
      const editorGoOriginal = document.getElementById('editorGoOriginal');
      const exportBtn = document.getElementById('exportSavesBtn');
      const importBtn = document.getElementById('importSavesBtn');
      const importInput = document.getElementById('importInput');
      const clearBackupsBtn = document.getElementById('clearBackupsBtn');
      const tennaBtn = document.getElementById('tennaBtn');

      let currentKey = null;
      let currentValue = null;
      let currentOriginalText = null;
      let isHexMode = false;
      let isDirty = false;
      let saveTimer = null;

      var savesSearch = document.getElementById('savesSearch');
      var savesCount = document.getElementById('savesCount');

      function markDirty() { isDirty = true; }
      function checkUnsaved() {
        if (isDirty && !confirm('You have unsaved changes. Discard them?')) return false;
        return true;
      }

      function openDB() {
        return new Promise(function(resolve, reject) {
          // Try without explicit version first to avoid VersionError
          var req = indexedDB.open(DB_NAME);
          req.onsuccess = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains(STORE)) {
              db.close();
              // Create the store with a version bump
              var req2 = indexedDB.open(DB_NAME, db.version + 1);
              req2.onupgradeneeded = function(e2) {
                e2.target.result.createObjectStore(STORE);
              };
              req2.onsuccess = function(e2) { resolve(e2.target.result); };
              req2.onerror = function(e2) { reject(e2.target.error); };
            } else {
              resolve(db);
            }
          };
          req.onerror = function(e) { reject(e.target.error); };
          req.onblocked = function() { reject(new Error('Database is locked by another tab. Close other tabs and retry.')); };
        });
      }

      function listAll() {
        return openDB().then(function(db) {
          return new Promise(function(resolve, reject) {
            const tx = db.transaction(STORE, 'readonly');
            const items = [];
            const req = tx.objectStore(STORE).openCursor();
            req.onsuccess = function(e) {
              const cursor = e.target.result;
              if (cursor) {
                items.push({ key: cursor.primaryKey, value: cursor.value });
                cursor.continue();
              } else {
                db.close();
                resolve(items);
              }
            };
            req.onerror = function(e) { db.close(); reject(e.target.error); };
          });
        });
      }

      function putEntry(key, value) {
        cachedItems = null;
        return openDB().then(function(db) {
          return new Promise(function(resolve, reject) {
            const tx = db.transaction(STORE, 'readwrite');
            const req = tx.objectStore(STORE).put(value, key);
            req.onsuccess = function() { db.close(); resolve(); };
            req.onerror = function(e) { db.close(); reject(e.target.error); };
          });
        });
      }

      function deleteEntry(key) {
        cachedItems = null;
        return openDB().then(function(db) {
          return new Promise(function(resolve, reject) {
            const tx = db.transaction(STORE, 'readwrite');
            const req = tx.objectStore(STORE).delete(key);
            req.onsuccess = function() { db.close(); resolve(); };
            req.onerror = function(e) { db.close(); reject(e.target.error); };
          });
        });
      }

      function getEntry(key) {
        return openDB().then(function(db) {
          return new Promise(function(resolve, reject) {
            const tx = db.transaction(STORE, 'readonly');
            const req = tx.objectStore(STORE).get(key);
            req.onsuccess = function() { db.close(); resolve(req.result || null); };
            req.onerror = function(e) { db.close(); reject(e.target.error); };
          });
        });
      }

      function isDirectory(value) {
        if (!value || typeof value.mode !== 'number') return false;
        return (value.mode & 0xF000) === 0x4000; // S_IFDIR
      }

      function tryDecodeText(bytes) {
        if (!bytes) return null;
        if (bytes instanceof ArrayBuffer) bytes = new Uint8Array(bytes);
        if (!(bytes instanceof Uint8Array)) return null;
        if (bytes.length === 0) return '';
        try {
          const text = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
          if (text.length === 0) return null;
          var bad = 0;
          for (var i = 0; i < text.length; i++) {
            var code = text.charCodeAt(i);
            if (code === 0xFFFD) bad++;
            else if (code < 8) bad++;
            else if (code > 13 && code < 32) bad++;
          }
          if (bad / text.length <= 0.05) return text;
          // fallback: decode as latin-1 (accepts any byte)
          var fallback = '';
          for (var i = 0; i < bytes.length; i++) fallback += String.fromCharCode(bytes[i]);
          bad = 0;
          for (var i = 0; i < fallback.length; i++) {
            var code = fallback.charCodeAt(i);
            if (code < 8) bad++;
            else if (code > 13 && code < 32) bad++;
          }
          if (bad / fallback.length > 0.05) return null;
          return fallback;
        } catch (e) {
          return null;
        }
      }

      function toHexInline(bytes) {
        if (!bytes) return '';
        if (bytes instanceof ArrayBuffer) bytes = new Uint8Array(bytes);
        var hex = '';
        for (var i = 0; i < bytes.length; i++) hex += ('00' + (bytes[i] || 0).toString(16)).slice(-2);
        return hex;
      }

      function toBase64(bytes) {
        let binary = '';
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return btoa(binary);
      }

      function fromBase64(b64) {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function formatSize(n) {
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / 1024 / 1024).toFixed(2) + ' MB';
      }

      function saveSingleFile(key, value) {
        if (!value || !value.contents) { alert('Empty file.'); return; }
        var name = key.replace(/[\\\/:*?"<>|]/g, '_').replace(/^_+/, '') || 'save';
        var blob = new Blob([value.contents], { type: 'application/octet-stream' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      }

      function refreshList() {
        saveEditor.hidden = true;
        hexPreview.hidden = true;
        savesList.hidden = false;
        savesList.innerHTML = '<div class="saves-empty">Loading...</div>';
        return getCachedItems().then(function(items) {
          var filter = savesSearch.value.toLowerCase().trim();
          const files = items.filter(function(it) { return !isDirectory(it.value); });
          if (files.length === 0) {
            savesList.innerHTML = '<div class="saves-empty">No save files found.<br><span class="saves-hint">Launch a chapter and create a save first.</span></div>';
            savesCount.textContent = '';
            return;
          }
          var filtered = files;
          if (filter) {
            filtered = files.filter(function(f) { return f.key.toLowerCase().indexOf(filter) !== -1; });
          }
          savesCount.textContent = filtered.length + ' / ' + files.length + ' files';
          if (filtered.length === 0) {
            savesList.innerHTML = '<div class="saves-empty">No files match filter.</div>';
            return;
          }
          filtered.sort(function(a, b) { return a.key.localeCompare(b.key); });
          savesList.innerHTML = '';
          filtered.forEach(function(item) {
            var data = item.value && item.value.contents;
            if (data instanceof ArrayBuffer) data = new Uint8Array(data);
            var size = data ? data.length : 0;
            const text = tryDecodeText(data);
            const isText = text !== null;
            var tag = getChapterTag(item.key);
            var preview = '';
            if (data && data.length > 0) {
              if (isText) {
                var lines = text.split('\n');
                preview = lines.slice(0, 3).map(function(l) { return l.trim().substring(0, 80); }).filter(Boolean).join(' | ');
              } else {
                var hex = '';
                for (var pi = 0; pi < Math.min(8, data.length); pi++) hex += ('00' + data[pi].toString(16)).slice(-2) + ' ';
                preview = hex.trim() + '...';
              }
            }
            const div = document.createElement('div');
            div.className = 'save-item';
            div.tabIndex = 0;
            const nameSpan = document.createElement('div');
            nameSpan.className = 'save-name';
            nameSpan.textContent = item.key;
            if (tag) {
              var tagSpan = document.createElement('span');
              tagSpan.className = 'save-chapter-tag';
              tagSpan.textContent = tag;
              nameSpan.appendChild(tagSpan);

      function fromHex(hex) {
        hex = hex.replace(/[^0-9a-fA-F]/g, '');
        if (hex.length % 2) throw new Error('Hex string has an odd number of digits (' + hex.length + ').');
        var bytes = new Uint8Array(hex.length / 2);
        for (var i = 0; i < bytes.length; i++) {
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        }
        return bytes;
      }

      var hexPreview = document.getElementById('hexPreview');

      function formatHexPreview(bytes) {
        if (typeof bytes.length !== 'number' || bytes.length === 0) return '';
        var out = '', ascii = '';
        for (var i = 0; i < Math.min(256, bytes.length); i++) {
          if (i % 16 === 0) {
            if (i > 0) out += '  ' + ascii + '\n';
            ascii = '';
            out += ('00000000' + i.toString(16)).slice(-8) + ': ';
          }
          out += ('00' + (bytes[i] || 0).toString(16)).slice(-2) + ' ';
          var c = bytes[i];
          ascii += (c >= 32 && c <= 126) ? String.fromCharCode(c) : '.';
        }
        var pad = 16 - (bytes.length % 16 || 16);
        for (var j = 0; j < pad; j++) out += '   ';
        out += '  ' + ascii;
        if (bytes.length > 256) out += '\n... (' + bytes.length + ' bytes total)';
        return out;
      }

          if (rtdb) { resolve(rtdb); return; }

            resolve(rtdb);

      // Encode/decode file keys for RTDB (forbidden: . # $ / [ ])
      function encodeKey(key) {
        if (/[\.\#\$\/\[\]~]/.test(key)) {
          var hex = '';
          for (var i = 0; i < key.length; i++) {
            var c = key.charCodeAt(i).toString(16);
            hex += ('00' + c).slice(-2);
          }
          return '~' + hex;
        }
        return key;
      }
      function decodeKey(key) {
        if (key.charAt(0) === '~') {
          var hex = key.slice(1);
          if (hex.length % 2 !== 0 || !/^[0-9a-fA-F]+$/.test(hex)) return key;
          var str = '';
          for (var i = 0; i < hex.length; i += 2) {
            str += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
          }
          return str;
        }
        return key;
      }

      function hashContent(bytes) {
        if (typeof crypto !== 'undefined' && crypto.subtle) {
          return crypto.subtle.digest('SHA-256', bytes).then(function(hash) {
            var hex = '';
            var view = new Uint8Array(hash);
            for (var i = 0; i < view.length; i++) hex += ('00' + view[i].toString(16)).slice(-2);
            return hex;
          }).catch(function() { return null; });
        }
        return Promise.resolve(null);
      }

      function getAllSavesAsObject() {
        return listAll().then(function(items) {
          var out = { version: 2, exportedAt: new Date().toISOString(), files: {} };
          var hashPromises = [];
          items.forEach(function(item) {
            if (isDirectory(item.value)) return;
            var v = item.value || {};
            var contents = v.contents;
            if (contents instanceof ArrayBuffer) contents = new Uint8Array(contents);
            var b64 = contents instanceof Uint8Array ? toBase64(contents) : null;
            var entry = {
              mode: v.mode,
              timestamp: v.timestamp instanceof Date ? v.timestamp.toISOString() : v.timestamp,
              contents: b64
            };
            hashPromises.push(hashContent(contents instanceof Uint8Array ? contents : null).then(function(h) {
              if (h) entry.hash = h;
            }));
            out.files[encodeKey(item.key)] = entry;
          });
          return Promise.all(hashPromises).then(function() { return out; });
        });
      }

      function importSavesFromObject(data) {
        if (!data || !data.files || typeof data.files !== 'object') {
          return Promise.reject(new Error('Invalid cloud save data.'));
        }
        return listAll().then(function(localItems) {
          var localMap = {};
          localItems.forEach(function(item) {
            if (!isDirectory(item.value)) localMap[item.key] = item.value;
          });
          var keys = Object.keys(data.files);
          var created = 0, overwritten = 0, skipped = 0, corrupt = 0;
          var verifyPromises = [];
          // Write files one at a time to avoid racing with the game's IDBFS sync
          var chain = Promise.resolve();
          keys.forEach(function(key) {
            chain = chain.then(function() {
              var v = data.files[key] || {};
              if (typeof v.mode === 'number' && (v.mode & 0xF000) === 0x4000) { skipped++; return; }
              var decoded = decodeKey(key);
              var contents = v.contents ? fromBase64(v.contents) : new Uint8Array(0);
              // Verify content hash if present (async but fire-and-forget)
              if (v.hash) {
                verifyPromises.push(hashContent(contents).then(function(computedHash) {
                  if (computedHash && computedHash !== v.hash) {
                    corrupt++;
                    if (window.__launcher && window.__launcher.toast) {
                      window.__launcher.toast('Hash mismatch for ' + decoded + ' — data may be corrupt.');
                    }
                  }
                }));
              }
              var value = {
                mode: typeof v.mode === 'number' ? v.mode : 33206,
                timestamp: v.timestamp ? new Date(v.timestamp) : new Date(),
                contents: contents
              };
              var existing = localMap[decoded];
              if (existing) {
                overwritten++;
                if (decoded.slice(-4) !== '.bak') {
                  var bakValue = { contents: existing.contents, mode: existing.mode, timestamp: new Date() };
                  return putEntry(decoded + '.bak', bakValue).then(function() {
                    return putEntry(decoded, value);
                  });
                } else {
                  return putEntry(decoded, value);
                }
              } else {
                created++;
                return putEntry(decoded, value);
              }
            });
          });
          return chain.then(function() {
            return Promise.all(verifyPromises).then(function() {
              return { created: created, overwritten: overwritten, skipped: skipped, corrupt: corrupt, total: keys.length };
            });
          });
        });
      }

      uploadBtn.addEventListener('click', function() {
        var path = getCloudPath();
        if (!path) { alert('Enter a Cloud ID first.'); return; }
        if (!confirm('Upload all save files to the cloud? This will overwrite the cloud backup.')) return;
        uploadBtn.disabled = true;
        uploadBtn.textContent = '\u231b Uploading...';
        cloudBusy = true;
        initFirebase().then(function() {
          return getAllSavesAsObject();
        }).then(function(data) {
          if (!rtdb) { throw new Error('Firebase not initialized.'); }
          // Estimate payload size: contents are already base64 strings; add ~10% JSON overhead
          var estBytes = 0;
          for (var k in data.files) {
            var v = data.files[k];
            if (v.contents) estBytes += v.contents.length;
          }
          var estPayload = Math.round(estBytes * 1.1 + 1024);
          if (estPayload > 10 * 1024 * 1024) {
            if (!confirm('Upload size is estimated at ' + (estPayload / 1024 / 1024).toFixed(1) + ' MB. Continue?')) {
              uploadBtn.textContent = '\u2601 Upload';
              uploadBtn.disabled = false;
              cloudBusy = false;

          }
          data.uploadedAt = new Date().toISOString();
          return rtdb.ref(path).set(data);
        }).then(function() {
          uploadBtn.textContent = '\u2601 Upload';
          uploadBtn.disabled = false;
          if (window.__launcher && window.__launcher.toast) window.__launcher.toast('Saves uploaded to cloud.');
          else alert('Saves uploaded successfully.');
        }).catch(function(err) {
          uploadBtn.textContent = '\u2601 Upload';
          uploadBtn.disabled = false;
          alert('Upload failed: ' + (err && err.message ? err.message : err));
        }).finally(function() {
          cloudBusy = false;
        });
      });

      downloadBtn.addEventListener('click', function() {
        var path = getCloudPath();
        if (!path) { alert('Enter a Cloud ID first.'); return; }
        if (!confirm('Download cloud saves?\nMissing files will be created, and existing files will be overwritten (a .bak backup is made of each first).')) return;
        downloadBtn.disabled = true;
        downloadBtn.textContent = '\u231b Downloading...';
        cloudBusy = true;
        initFirebase().then(function() {
          if (!rtdb) { throw new Error('Firebase not initialized.'); }
          return rtdb.ref(path).once('value');
        }).then(function(snapshot) {
          var data = snapshot.val();
          if (!data) {
            alert('No cloud saves found for this ID.');
            return;
          }
          return importSavesFromObject(data).then(function(result) {
            downloadBtn.textContent = '\u2601 Download';
            downloadBtn.disabled = false;
            var msg = 'Downloaded from cloud: ' + result.created + ' new, ' + result.overwritten + ' updated';
            if (result.skipped) msg += ', ' + result.skipped + ' skipped';
            if (result.corrupt) msg += ', ' + result.corrupt + ' HASH MISMATCH (data may be corrupt!)';
            msg += '.';
            if (window.__launcher && window.__launcher.toast) window.__launcher.toast(msg);
            else alert(msg);
            invalidateCache();
            refreshList();
          });
        }).catch(function(err) {
          alert('Download failed: ' + (err && err.message ? err.message : err));
        }).finally(function() {
          downloadBtn.textContent = '\u2601 Download';
          downloadBtn.disabled = false;
          cloudBusy = false;
        });
      });

      savesBtn.addEventListener('click', openModal);
      closeSavesBtn.addEventListener('click', closeModal);
      savesModal.addEventListener('click', function(e) {
        if (e.target === savesModal) closeModal();
      });
      document.addEventListener('keydown', function(e) {
        if (!savesModal.hidden && e.key === 'Escape') {
          e.stopPropagation();
          closeModal();
        }
      }, true); // capture phase so it runs before launcher's keydown

      // Modal focus trap
      savesModal.addEventListener('keydown', function(e) {
        if (e.key !== 'Tab') return;
        var focusable = savesModal.querySelectorAll('button, input, textarea, select, [tabindex]:not([tabindex="-1"])');
        if (focusable.length === 0) return;
        var first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first) { e.preventDefault(); last.focus(); }
        } else {
          if (document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });

      // Global keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (!savesModal.hidden && (e.ctrlKey || e.metaKey)) {
          if (e.key === 's') {
            e.preventDefault();
            if (!saveEditor.hidden && !editorSave.disabled) editorSave.click();
          } else if (e.key === 'e') {
            e.preventDefault();
            if (currentKey && currentValue) saveSingleFile(currentKey, currentValue);
          } else if (e.key === 'f') {
            e.preventDefault();
            savesSearch.focus();
            savesSearch.select();
          }
        }
      });
    })();
  </script>
</body>
</html>
