<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Deltarune Web Launcher</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <iframe id="chapterFrame" title="Deltarune Chapter" allowfullscreen></iframe>

  <button id="backBtn" class="back-btn" aria-label="Back to menu">&#9664; Menu</button>

  <div class="logo-container" id="logoContainer">
    <img src="logo.png" alt="Deltarune Logo" class="logo">
  </div>

  <nav class="menu" id="mainMenu" role="navigation" aria-label="Chapter selection">
    <a href="javascript:void(0)" onclick="loadChapter(1)" class="row" role="button" tabindex="0" aria-label="Chapter 1 The Beginning">
      <span class="chapter">Chapter 1</span>
      <span class="title">The Beginning</span>
      <img src="icons/1.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="loadChapter(2)" class="row" role="button" tabindex="0" aria-label="Chapter 2 A Cyber's World">
      <span class="chapter">Chapter 2</span>
      <span class="title">A Cyber's World</span>
      <img src="icons/2.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="loadChapter(3)" class="row" role="button" tabindex="0" aria-label="Chapter 3 Late Night">
      <span class="chapter">Chapter 3</span>
      <span class="title">Late Night</span>
      <img src="icons/3.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="loadChapter(4)" class="row" role="button" tabindex="0" aria-label="Chapter 4 Prophecy">
      <span class="chapter">Chapter 4</span>
      <span class="title">Prophecy</span>
      <img src="icons/4.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="loadChapter(5)" class="row" role="button" tabindex="0" aria-label="Chapter 5 Festival Day">
      <span class="chapter">Chapter 5</span>
      <span class="title">Festival Day</span>
      <img src="icons/5.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="alert('Chapter 6 coming soon!')" class="disabled-row" role="button" aria-disabled="true" tabindex="-1" aria-label="Chapter 6 coming soon">
      <span class="chapter">Chapter 6</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png" alt="" loading="lazy">
    </a>
    <a href="javascript:void(0)" onclick="alert('Chapter 7 coming soon!')" class="disabled-row" role="button" aria-disabled="true" tabindex="-1" aria-label="Chapter 7 coming soon">
      <span class="chapter">Chapter 7</span>
      <span class="disabled-title">--</span>
      <img src="icons/0.png" alt="" loading="lazy">
    </a>
  </nav>

  <div id="versionTag"></div>

  <audio id="drone" loop hidden>
    <source src="audios/AUDIO_DRONE.ogg" type="audio/ogg">
    <source src="audios/AUDIO_DRONE.mp3" type="audio/mpeg">
  </audio>
  <button id="settingsBtn" aria-label="Settings" title="Settings">&#9881;</button>
  <button id="savesBtn" aria-label="Manage save files" title="Manage save files">&#128190;</button>
  <button id="mute" aria-label="Toggle menu music">&#128266;</button>

  <div id="settingsPanel" class="settings-panel" hidden>
    <div class="settings-row">
      <span class="settings-label">Game Speed</span>
      <div class="settings-slider-row">
        <span class="settings-slider-label">0.25&#215;</span>
        <input type="range" id="speedSlider" min="0.25" max="5" step="0.25" value="1">
        <span class="settings-slider-label" id="speedValue">1.0&#215;</span>
      </div>
    </div>
    <div class="settings-row" style="margin-top:10px">
      <span class="settings-label">Volume</span>
      <div class="settings-slider-row">
        <span class="settings-slider-label">0%</span>
        <input type="range" id="volumeSlider" min="0" max="100" step="5" value="100">
        <span class="settings-slider-label" id="volumeValue">100%</span>
      </div>
    </div>
    <div class="settings-row" style="margin-top:10px">
      <button id="fullscreenBtn" class="settings-btn">Fullscreen</button>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <!-- Saves Modal -->
  <div id="savesModal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="savesModalTitle">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="savesModalTitle">Save Files</h2>
        <button id="closeSavesBtn" class="modal-close" aria-label="Close">&times;</button>
      </div>
      <div id="cloudRow" class="cloud-row">
        <input type="text" id="cloudId" placeholder="Cloud ID (e.g. player1)" class="cloud-input">
        <button id="uploadBtn" class="cloud-btn">&#9729; Upload</button>
        <button id="downloadBtn" class="cloud-btn">&#9729; Download</button>
        <span id="syncStatus" class="sync-status"></span>
      </div>
      <div class="modal-body">
        <div id="savesWarning" class="saves-warning" hidden>Game is running — avoid editing while the game is saving.</div>
        <div class="saves-search-row">
          <input type="text" id="savesSearch" class="saves-search" placeholder="Filter filenames..." spellcheck="false">
          <button id="searchClearBtn" class="search-clear-btn" hidden>&times;</button>
          <button id="newFileBtn" class="new-file-btn">+ New</button>
          <select id="sortSelect" class="sort-select">
            <option value="name">Name</option>
            <option value="chapter">Chapter</option>
            <option value="size">Size</option>
            <option value="date">Date</option>
          </select>
          <span id="savesCount" class="saves-count"></span>
        </div>
        <div id="savesList" class="saves-list"></div>
        <div id="saveEditor" class="save-editor" hidden>
          <div class="editor-header">
            <button id="editorBack" class="editor-back-btn">&#9664; Back</button>
            <span id="editorFilename" class="editor-filename"></span>
            <button id="renameBtn" class="rename-btn" title="Rename file">&#9998;</button>
          </div>
          <textarea id="editorTextarea" spellcheck="false" autocomplete="off"></textarea>
          <div id="hexPreview" class="hex-preview" hidden></div>
          <div class="editor-actions">
            <button id="editorSave" class="btn-primary">Save Changes</button>
            <button id="editorDelete" class="btn-danger">Delete File</button>
            <button id="editorRestoreBackup" class="btn-restore" hidden>Restore from Backup</button>
            <button id="editorGoOriginal" class="btn-restore" hidden>Go to Original</button>
          </div>
        </div>
      </div>
      <div class="modal-footer" id="savesModalFooter">
        <button id="tennaBtn">Tenna Editor</button>
        <button id="exportSavesBtn">Export All</button>
        <button id="importSavesBtn" title="Import a saves .json bundle, or DELTARUNE's own save files (filech1_0, dr.ini, keyconfig_0.ini, ...)">Import</button>
        <input type="file" id="importInput" multiple hidden>
        <button id="clearBackupsBtn">Clear Backups</button>
        <button id="repairPathsBtn" hidden>Repair saves</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const audio = document.getElementById('drone');
      const mute = document.getElementById('mute');
      const savesBtn = document.getElementById('savesBtn');
      const backBtn = document.getElementById('backBtn');
      const iframe = document.getElementById('chapterFrame');
      const menu = document.getElementById('mainMenu');
      const logo = document.getElementById('logoContainer');
      let gamestarted = false;
      let backTimer = null;
      window.__launcher = { isGameStarted: () => gamestarted };
      let selectedChapter = null;
      const rows = () => menu.querySelectorAll('.row');
      const origin = window.location.origin;
      const SPEED_KEY = 'deltarune_speed';
      const settingsBtn = document.getElementById('settingsBtn');
      const settingsPanel = document.getElementById('settingsPanel');
      const speedSlider = document.getElementById('speedSlider');
      const speedValue = document.getElementById('speedValue');
      const versionTag = document.getElementById('versionTag');
      // document.lastModified is local-time and can be unparseable; a RangeError
      // here used to abort this whole IIFE, leaving every chapter row's inline
      // onclick="loadChapter(N)" as a ReferenceError.
      try {
        var built = new Date(document.lastModified);
        var stamp = isNaN(built.getTime()) ? '' : ' (' + built.getFullYear() + '-' +
          ('0' + (built.getMonth() + 1)).slice(-2) + '-' + ('0' + built.getDate()).slice(-2) + ')';
        versionTag.textContent = 'v.2' + stamp;
      } catch (e) { versionTag.textContent = 'v0.2.3'; }

      function getSpeed() { var v = parseFloat(localStorage.getItem(SPEED_KEY)); return (isFinite(v) && v > 0) ? v : 1; }
      function setSpeed(v) {
        v = Math.round(v / 0.25) * 0.25;
        v = Math.max(0.25, Math.min(5, v));
        localStorage.setItem(SPEED_KEY, String(v));
        speedSlider.value = v;
        speedValue.textContent = (v < 1 ? v.toFixed(2) : v.toFixed(1)) + '\u00d7';
      }
      function syncSpeedFromStorage() { setSpeed(getSpeed()); }
      speedSlider.addEventListener('input', function() { setSpeed(parseFloat(this.value)); });

      function openSettings() {
        settingsPanel.hidden = false;
        syncSpeedFromStorage();
        speedSlider.focus();
      }
      function closeSettings() { settingsPanel.hidden = true; }
      settingsBtn.addEventListener('click', function(e) {
        // Toggle: the outside-click handler below excludes the button, so an
        // open-only handler left no way to close the panel over a running game.
        if (settingsPanel.hidden) openSettings(); else closeSettings();
      });
      document.addEventListener('click', function(e) {
        if (!settingsPanel.hidden && !settingsBtn.contains(e.target) && !settingsPanel.contains(e.target)) {
          closeSettings();
        }
      });

      var volumeSlider = document.getElementById('volumeSlider');
      var volumeValue = document.getElementById('volumeValue');
      var VOLUME_KEY = 'deltarune_volume';
      function getVolume() { var v = parseFloat(localStorage.getItem(VOLUME_KEY)); return isFinite(v) ? Math.max(0, Math.min(100, v)) : 100; }
      function setVolume(v) {
        v = Math.round(Math.max(0, Math.min(100, v)));
        localStorage.setItem(VOLUME_KEY, String(v));
        volumeSlider.value = v;
        volumeValue.textContent = v + '%';
        // The slider used to drive the game frame only, so the menu drone and
        // the menu SFX stayed at 100% however low it was set.
        var g = v / 100;
        audio.volume = g;
        if (typeof menumoveaudio !== 'undefined') menumoveaudio.volume = g;
        if (typeof menuselectaudio !== 'undefined') menuselectaudio.volume = g;
        if (gamestarted) {
          try { iframe.contentWindow.postMessage({ type: 'volume', volume: g }, origin); } catch(e) {}
        }
      }
      volumeSlider.addEventListener('input', function() { setVolume(parseFloat(this.value)); });
      setVolume(getVolume());

      var fullscreenBtn = document.getElementById('fullscreenBtn');
      fullscreenBtn.addEventListener('click', function() {
        if (document.fullscreenElement) {
          document.exitFullscreen().catch(function(){});
        } else if (iframe.requestFullscreen) {
          iframe.requestFullscreen().catch(function(){});
        }
      });

      function updateMuteButton() {
        mute.textContent = audio.muted ? '🔇' : '🔊';
      }
      updateMuteButton();

      // Start menu drone on first user interaction (replaces removed autoplay).
      // The first click is usually the chapter row itself, and this listener
      // runs after its onclick has already started the game — so it must not
      // start the drone under a running chapter.
      var droneStarted = false;
      function startDrone() {
        if (droneStarted) return;
        droneStarted = true;
        if (!gamestarted) audio.play().catch(function(){});
        document.removeEventListener('click', startDrone);
        document.removeEventListener('keydown', startDrone);
      }
      document.addEventListener('click', startDrone);
      document.addEventListener('keydown', startDrone);

      mute.addEventListener('click', () => {
        if (!gamestarted) {
          audio.muted = !audio.muted;
          updateMuteButton();
        }
      });

      function toast(msg, duration) {
        duration = duration || 3000;
        var el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        var c = document.getElementById('toastContainer');
        if (!c) return;
        c.appendChild(el);
        setTimeout(function() { el.classList.add('toast-hide'); setTimeout(function() { el.remove(); }, 300); }, duration);
      }
      window.__launcher.toast = toast;

      // Chapters 1-4 are standalone builds at chapterN/index.html.
      // Chapter 5 ships as part of the multi-chapter build in test/, which
      // selects the chapter via the ?c= query parameter.
      var CHAPTER_URLS = {
        5: 'test/index.html?c=5'
      };
      function chapterUrl(chapter) {
        return CHAPTER_URLS[chapter] || ('chapter' + chapter + '/index.html');
      }

      window.loadChapter = function(chapter) {
        // gamestarted stays true through the 500 ms teardown; a relaunch inside
        // that window finishes the teardown instead of being swallowed.
        if (gamestarted && !backTimer) return;
        if (backTimer) { clearTimeout(backTimer); backTimer = null; gamestarted = false; }
        menuselectaudio.play().catch(function(){});
        gamestarted = true;

        // The first user click is usually the chapter row itself, which also
        // starts the menu drone — it then looped under the whole chapter with
        // the mute button hidden and no way to silence it.
        audio.pause();

        menu.classList.add('hidden-menu');
        logo.classList.add('hidden-menu');
        mute.style.display = 'none';
        settingsBtn.style.display = 'block';
        backBtn.style.display = 'block';
        versionTag.style.display = 'none';

        iframe.src = chapterUrl(chapter);
        iframe.classList.add('active');

        iframe.onload = function() {
          iframe.contentWindow.focus();
          setVolume(getVolume());
        };
      };

      function backToMenu() {
        if (!gamestarted) return;
        iframe.classList.remove('active');
        if (backTimer) clearTimeout(backTimer);
        // The frame keeps running (and playing) until it is torn down, so the
        // "is the game running?" flag has to stay true for that whole window —
        // the save manager uses it to warn about editing under a live game.
        iframe.onload = null;
        backTimer = setTimeout(function() {
          iframe.src = 'about:blank';
          backTimer = null;
          gamestarted = false;
        }, 500);
        selectedChapter = null;
        rows().forEach(function(r) { r.classList.remove('selected'); });

        menu.classList.remove('hidden-menu');
        logo.classList.remove('hidden-menu');
        mute.style.display = 'block';
        settingsBtn.style.display = 'none';
        closeSettings();
        backBtn.style.display = 'none';
        versionTag.style.display = 'block';
        updateMuteButton();
        if (droneStarted && !audio.muted) audio.play().catch(function(){});

        var first = rows()[0];
        if (first) first.focus();
      }
      backBtn.addEventListener('click', backToMenu);

      // Menu sounds
      var menumoveaudio = new Audio('audios/snd_menumove.mp3');
      var menuselectaudio = new Audio('audios/snd_select.mp3');

      rows().forEach(function(row) {
        row.addEventListener('mouseenter', function() {
          if (!gamestarted) {
            menumoveaudio.play().catch(function(){});
            if (selectedChapter !== null && rows()[selectedChapter]) {
              rows()[selectedChapter].classList.remove('selected');
            }
            selectedChapter = Array.prototype.indexOf.call(rows(), row);
            row.classList.add('selected');
          }
        });
      });

      // Keys the launcher owns while a chapter is running.
      function handleLauncherKey(key) {
        if (key === 'Escape') {
          if (!settingsPanel.hidden) { closeSettings(); return true; }
          backToMenu();
          return true;
        }
        if (key === '[') { setSpeed(getSpeed() - 0.25); return true; }
        if (key === ']') { setSpeed(getSpeed() + 0.25); return true; }
        if (key === '\\') { setSpeed(1); return true; }
        return false;
      }

      // Once the game canvas has focus this document stops receiving keys, so
      // speed.js inside the frame forwards exactly these four up to us. The old
      // parent→frame {type:'keydown'} forwarding was dead: its receivers called
      // handleKeyDown/handleKeyUp, which exist nowhere in the build.
      window.addEventListener('message', function(e) {
        if (e.origin !== origin || e.source !== iframe.contentWindow) return;
        if (!e.data || e.data.type !== 'launcher-key') return;
        if (gamestarted) handleLauncherKey(e.data.key);
      });

      // Keyboard navigation
      document.addEventListener('keydown', function(event) {
        // Never drive the menu from keystrokes aimed at the save manager: arrow
        // keys used to yank focus out of the editor onto a chapter row behind
        // the modal, and Enter then launched that chapter over an open editor.
        var savesModal = document.getElementById('savesModal');
        if (savesModal && !savesModal.hidden) return;
        var t = event.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) return;

        if (gamestarted) {
          if (handleLauncherKey(event.key)) event.preventDefault();
          return;
        }

        if (event.key === 'ArrowUp') {
          event.preventDefault();
          if (selectedChapter === null) {
            selectedChapter = 0;
          } else {
            if (rows()[selectedChapter]) rows()[selectedChapter].classList.remove('selected');
            selectedChapter--;
            if (selectedChapter < 0) selectedChapter = rows().length - 1;
          }
          if (rows()[selectedChapter]) {
            rows()[selectedChapter].classList.add('selected');
            rows()[selectedChapter].focus();
          }
          menumoveaudio.play().catch(function(){});
        } else if (event.key === 'ArrowDown') {
          event.preventDefault();
          if (selectedChapter === null) {
            selectedChapter = 0;
          } else {
            if (rows()[selectedChapter]) rows()[selectedChapter].classList.remove('selected');
            selectedChapter = (selectedChapter + 1) % rows().length;
          }
          if (rows()[selectedChapter]) {
            rows()[selectedChapter].classList.add('selected');
            rows()[selectedChapter].focus();
          }
          menumoveaudio.play().catch(function(){});
        } else if (event.key === 'Enter') {
          if (selectedChapter !== null && rows()[selectedChapter]) {
            rows()[selectedChapter].click();
          }
        }
      });
    })();
  </script>

  <script>
    // Save file manager: reads/writes the GameMaker IDBFS database (/_savedata)
    (function() {
      const DB_NAME = '/_savedata';
      const STORE = 'FILE_DATA';
      // IDBFS keys every file by its absolute path under the mount point, and
      // builds the local side of a sync as mountpoint + "/" + name. An entry
      // stored under a bare name ("filech4_1") therefore has no local
      // counterpart: the game never sees it, and the next syncfs deletes it as
      // an orphan. Every key we write must be normalised to /_savedata/<name>.
      const SAVE_DIR = '/_savedata';

      // Returns the full IDBFS path for a save name or key, or null when it
      // cannot be represented. Nested paths are legal — the game mounts a whole
      // directory and its own builds map names like "assets/options.ini" into
      // it — but "." / ".." segments, empty segments and control characters are
      // rejected rather than mangled: the old version was a fixed point for
      // "/_savedata/_savedata/x" and "..", so brokenReason() called those
      // healthy while the game's reconcile threw on FS.writeFile() and then
      // loaded none of the saves.
      function normalizeKey(name) {
        var n = String(name == null ? '' : name);
        // Leave the mount directory entry itself alone.
        if (n === SAVE_DIR || n === SAVE_DIR + '/') return n;
        n = n.replace(/^\/+/, '');
        while (n.indexOf('_savedata/') === 0) n = n.slice('_savedata/'.length).replace(/^\/+/, '');
        n = n.replace(/\/+$/, '');
        var segments = n.split('/');
        if (!segments.length) return null;
        for (var i = 0; i < segments.length; i++) {
          if (!isValidSaveName(segments[i])) return null;
        }
        return SAVE_DIR + '/' + segments.join('/');
      }

      // One path segment: the name the game hands to FS.writeFile / FS.mkdir.
      function isValidSaveName(name) {
        var n = String(name == null ? '' : name);
        if (!n || n !== n.trim()) return false;
        if (n === '.' || n === '..') return false;
        if (n.indexOf('/') !== -1 || n.indexOf('\\') !== -1) return false;
        if (/[\x00-\x1f\x7f]/.test(n)) return false;
        if (n.length > 128) return false;
        return true;
      }

      // A key is storable only if it normalises to itself.
      function isValidSaveKey(key) {
        var k = String(key == null ? '' : key);
        if (k.indexOf(SAVE_DIR + '/') !== 0) return false;
        return normalizeKey(k) === k;
      }

      // "/_savedata/assets/options.ini" -> ["/_savedata/assets"]. IDBFS stores a
      // directory entry for every folder it syncs, and the reconcile creates
      // them before the files inside (sorted order), so a nested file whose
      // parent entry is missing makes FS.writeFile fail with ENOENT.
      function parentDirKeys(key) {
        var rel = displayName(key).split('/');
        var out = [];
        var acc = SAVE_DIR;
        for (var i = 0; i < rel.length - 1; i++) {
          acc += '/' + rel[i];
          out.push(acc);
        }
        return out;
      }

      function displayName(key) {
        var k = String(key == null ? '' : key);
        return k.indexOf(SAVE_DIR + '/') === 0 ? k.slice(SAVE_DIR.length + 1) : k;
      }

      // S_IFREG | 0666 — the mode IDBFS itself writes for save files.
      const FILE_MODE = 33206;

      function isDirMode(mode) {
        return typeof mode === 'number' && (mode & 0xF000) === 0x4000; // S_IFDIR
      }

      function toBytes(contents) {
        if (contents instanceof Uint8Array) return contents;
        if (contents instanceof ArrayBuffer) return new Uint8Array(contents);
        if (ArrayBuffer.isView(contents)) return new Uint8Array(contents.buffer, contents.byteOffset, contents.byteLength);
        if (Array.isArray(contents)) return new Uint8Array(contents);
        if (typeof contents === 'string') return new TextEncoder().encode(contents);
        return null;
      }

      // The game's save mount reconciles by calling value.timestamp.getTime(),
      // switching on value.mode and handing value.contents to FS.writeFile. One
      // entry with a numeric timestamp, a missing mode or non-byte contents
      // throws inside that reconcile, which aborts it wholesale — the game then
      // loads *none* of the saves. Every value we write goes through here.
      function normalizeValue(value) {
        var v = value || {};
        var timestamp = v.timestamp instanceof Date ? v.timestamp : new Date(v.timestamp || Date.now());
        if (isNaN(timestamp.getTime())) timestamp = new Date();
        if (isDirMode(v.mode)) return { mode: v.mode, timestamp: timestamp };
        var bytes = v.contents == null ? new Uint8Array(0) : toBytes(v.contents);
        // Refuse rather than substitute an empty file: silently blanking an
        // unconvertible payload (a Blob, a structured-clone object) destroyed
        // the save the "Repair saves" button was supposed to rescue.
        if (!bytes) throw new Error('save contents are not raw bytes and cannot be converted');
        return {
          contents: bytes,
          mode: typeof v.mode === 'number' && v.mode > 0 ? v.mode : FILE_MODE,
          timestamp: timestamp
        };
      }

      // Can this entry be repaired in place, or would rewriting it lose data?
      function isRepairable(value) {
        var v = value || {};
        if (isDirMode(v.mode)) return true;
        return v.contents == null || toBytes(v.contents) !== null;
      }

      // Why the game cannot read this entry, or null when it can. `keySet`, when
      // given, is every key in the store, so a nested file can be checked for
      // the directory entry the reconcile needs.
      function brokenReason(key, value, keySet) {
        var good = normalizeKey(key);
        if (good === null) return 'stored under a name the game cannot use';
        if (key !== good) return 'stored as "' + key + '" instead of "' + good + '"';
        var v = value || {};
        if (!(v.timestamp instanceof Date) || isNaN(v.timestamp.getTime())) return 'timestamp is not a Date';
        if (isDirMode(v.mode)) return null;
        if (typeof v.mode !== 'number' || v.mode <= 0) return 'file mode is missing';
        if (!(v.contents instanceof Uint8Array)) return 'contents are not raw bytes';
        if (keySet) {
          var parents = parentDirKeys(key);
          for (var i = 0; i < parents.length; i++) {
            if (!keySet[parents[i]]) return 'the folder entry "' + displayName(parents[i]) + '" is missing';
          }
        }
        return null;
      }

      if (indexedDB.databases) {
        indexedDB.databases().then(function(dbs) {
          console.log('[Saves] Available databases:', dbs.map(function(d) { return d.name + ' v' + d.version; }));
        });
      }

      const savesBtn = document.getElementById('savesBtn');
      const savesModal = document.getElementById('savesModal');
      const closeSavesBtn = document.getElementById('closeSavesBtn');
      const savesList = document.getElementById('savesList');
      const savesWarning = document.getElementById('savesWarning');
      const saveEditor = document.getElementById('saveEditor');
      const editorFilename = document.getElementById('editorFilename');
      const editorBack = document.getElementById('editorBack');
      const editorTextarea = document.getElementById('editorTextarea');
      const editorSave = document.getElementById('editorSave');
      const editorDelete = document.getElementById('editorDelete');
      const editorRestoreBackup = document.getElementById('editorRestoreBackup');
      const editorGoOriginal = document.getElementById('editorGoOriginal');
      const exportBtn = document.getElementById('exportSavesBtn');
      const importBtn = document.getElementById('importSavesBtn');
      const importInput = document.getElementById('importInput');
      const clearBackupsBtn = document.getElementById('clearBackupsBtn');
      const repairPathsBtn = document.getElementById('repairPathsBtn');
      const tennaBtn = document.getElementById('tennaBtn');

      let currentKey = null;
      let currentValue = null;
      let currentOriginalText = null;
      let isHexMode = false;
      let currentEncoding = 'utf-8';   // decoder that produced the textarea contents
      let isDirty = false;
      let saveTimer = null;

      var savesSearch = document.getElementById('savesSearch');
      var searchClearBtn = document.getElementById('searchClearBtn');
      var newFileBtn = document.getElementById('newFileBtn');
      var renameBtn = document.getElementById('renameBtn');
      var sortSelect = document.getElementById('sortSelect');
      var sortBy = 'name';
      var savesCount = document.getElementById('savesCount');

      function markDirty() { isDirty = true; }
      function checkUnsaved() {
        if (isDirty && !confirm('You have unsaved changes. Discard them?')) return false;
        return true;
      }

      // Long operations (cloud sync, repair, rename, import) block closing the
      // modal. A single shared boolean let a fast local op release the lock in
      // the middle of a cloud write, so this counts instead.
      var busyCount = 0;
      function beginBusy() { busyCount++; }
      function endBusy() { if (busyCount > 0) busyCount--; }
      function isBusy() { return busyCount > 0; }

      // IDBFS — the mount the game reads its saves through — opens this database
      // at version 21 and enumerates files through the "timestamp" index. Create
      // the store the same way, at the same version, so the game never has to run
      // an upgrade of its own: an upgrade blocks while the launcher holds a
      // connection, which hangs chapter boot.
      const IDBFS_VERSION = 21;

      function openDB() {
        return new Promise(function(resolve, reject) {
          function locked() {
            reject(new Error('Database is locked by another tab. Close other tabs and retry.'));
          }
          function ready(db) {
            // Drop the connection the moment another client needs an upgrade,
            // otherwise the launcher blocks chapter boot.
            db.onversionchange = function() { try { db.close(); } catch (e) {} };
            resolve(db);
          }
          function upgrade(fromVersion) {
            var req2 = indexedDB.open(DB_NAME, Math.max(fromVersion + 1, IDBFS_VERSION));
            req2.onupgradeneeded = function(e2) {
              var idb = e2.target.result;
              var store = idb.objectStoreNames.contains(STORE)
                ? e2.target.transaction.objectStore(STORE)
                : idb.createObjectStore(STORE);
              if (!store.indexNames.contains('timestamp')) {
                store.createIndex('timestamp', 'timestamp', { unique: false });
              }
            };
            req2.onsuccess = function(e2) { ready(e2.target.result); };
            req2.onerror = function(e2) { reject(e2.target.error); };
            req2.onblocked = locked;
          }
          // Open without a version first: the store usually exists already, and
          // asking for a lower version than the stored one throws VersionError.
          var req = indexedDB.open(DB_NAME);
          req.onsuccess = function(e) {
            var db = e.target.result;
            if (!db.objectStoreNames.contains(STORE)) { db.close(); upgrade(db.version); return; }
            // The store can exist without the timestamp index (older builds
            // created it that way); IDBFS enumerates through that index, so the
            // game sees nothing until it is there.
            var hasIndex = true;
            try {
              hasIndex = db.transaction(STORE, 'readonly').objectStore(STORE).indexNames.contains('timestamp');
            } catch (err) {}
            if (!hasIndex) { db.close(); upgrade(db.version); return; }
            ready(db);
          };
          req.onerror = function(e) { reject(e.target.error); };
          req.onblocked = locked;
        });
      }

      // Every helper below opens its own short-lived connection. An aborted
      // transaction fires no request error, so without these handlers the
      // promise stayed pending forever and the connection leaked open —
      // which then blocked the game's upgrade.
      function withStore(mode, run) {
        return openDB().then(function(db) {
          return new Promise(function(resolve, reject) {
            var tx;
            try {
              tx = db.transaction(STORE, mode);
            } catch (e) { db.close(); reject(e); return; }
            tx.onabort = tx.onerror = function() { db.close(); reject(tx.error || new Error('Save database transaction aborted.')); };
            try {
              run(tx.objectStore(STORE), function(result) { db.close(); resolve(result); }, function(err) { db.close(); reject(err); });
            } catch (e) { db.close(); reject(e); }
          });
        });
      }

      function listAll() {
        return withStore('readonly', function(store, done, fail) {
          var items = [];
          var req = store.openCursor();
          req.onsuccess = function(e) {
            var cursor = e.target.result;
            if (cursor) {
              items.push({ key: cursor.primaryKey, value: cursor.value });
              cursor.continue();
            } else {
              done(items);
            }
          };
          req.onerror = function(e) { fail(e.target.error); };
        });
      }

      // Writes at EXACTLY the key given. It used to re-target through
      // normalizeKey, so saving from a row whose key was malformed silently
      // overwrote the healthy save at the normalised path instead. Callers that
      // hold a bare name call normalizeKey themselves and skip a null result.
      function putEntry(key, value) {
        var normalized;
        try {
          if (!isValidSaveKey(key)) {
            throw new Error('"' + displayName(key) + '" is not a name the game can read.');
          }
          normalized = normalizeValue(value);
        } catch (e) { return Promise.reject(e); }
        delete valueCache[key];
        delete valueCache[key + '.bak'];
        return withStore('readwrite', function(store, done, fail) {
          var req = store.put(normalized, key);
          req.onsuccess = function() { done(); };
          req.onerror = function(e) { fail(e.target.error); };
        });
      }

      function deleteEntry(key) {
        delete valueCache[key];
        return withStore('readwrite', function(store, done, fail) {
          var req = store.delete(key);
          req.onsuccess = function() { done(); };
          req.onerror = function(e) { fail(e.target.error); };
        });
      }

      // Reads the key exactly as given, without normalisation.
      function getRawEntry(key) {
        return withStore('readonly', function(store, done, fail) {
          var req = store.get(key);
          req.onsuccess = function() { done(req.result || null); };
          req.onerror = function(e) { fail(e.target.error); };
        });
      }


      function isDirectory(value) {
        return !!value && isDirMode(value.mode);
      }

      // Decodes for the editor and reports which decoder won, so the save path
      // can re-encode with that decoder's exact inverse. Re-encoding a latin-1
      // decode with TextEncoder doubled every byte >= 0x80, and a UTF-8 decode
      // that contained U+FFFD replaced the original bytes for good.
      function decodeForEditor(bytes) {
        if (!bytes) return null;
        if (bytes instanceof ArrayBuffer) bytes = new Uint8Array(bytes);
        if (!(bytes instanceof Uint8Array)) return null;
        if (bytes.length === 0) return { text: '', encoding: 'utf-8' };
        try {
          var text = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
          if (text.length && text.indexOf('\uFFFD') === -1 && !hasControlChars(text)) {
            // Only trust UTF-8 when it round-trips byte for byte.
            var back = new TextEncoder().encode(text);
            if (back.length === bytes.length) {
              var same = true;
              for (var i = 0; i < bytes.length; i++) { if (back[i] !== bytes[i]) { same = false; break; } }
              if (same) return { text: text, encoding: 'utf-8' };
            }
          }
          // latin-1 accepts any byte and is exactly invertible.
          var fallback = '';
          for (var j = 0; j < bytes.length; j++) fallback += String.fromCharCode(bytes[j]);
          if (hasControlChars(fallback)) return null;
          return { text: fallback, encoding: 'latin-1' };
        } catch (e) {
          return null;
        }
      }

      function hasControlChars(text) {
        var bad = 0;
        for (var i = 0; i < text.length; i++) {
          var code = text.charCodeAt(i);
          if (code < 8 || (code > 13 && code < 32)) bad++;
        }
        return bad / text.length > 0.05;
      }

      // Inverse of decodeForEditor. latin-1 rejects anything above U+00FF so a
      // pasted non-latin character fails loudly instead of corrupting the file.
      function encodeFromEditor(text, encoding) {
        if (encoding !== 'latin-1') return new TextEncoder().encode(text);
        var out = new Uint8Array(text.length);
        for (var i = 0; i < text.length; i++) {
          var code = text.charCodeAt(i);
          if (code > 0xFF) {
            throw new Error('This save is binary; "' + text.charAt(i) + '" cannot be stored. Switch to hex editing.');
          }
          out[i] = code;
        }
        return out;
      }

      function toHexInline(bytes) {
        if (!bytes) return '';
        if (bytes instanceof ArrayBuffer) bytes = new Uint8Array(bytes);
        var hex = '';
        for (var i = 0; i < bytes.length; i++) hex += ('00' + (bytes[i] || 0).toString(16)).slice(-2);
        return hex;
      }

      function toBase64(bytes) {
        let binary = '';
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        return btoa(binary);
      }

      function fromBase64(b64) {
        const binary = atob(b64);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return bytes;
      }

      function formatSize(n) {
        if (n < 1024) return n + ' B';
        if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
        return (n / 1024 / 1024).toFixed(2) + ' MB';
      }

      function saveSingleFile(key, value) {
        var bytes = toBytes(value && value.contents);
        // The Blob constructor stringifies anything that is not a BufferSource,
        // so an unreadable entry used to "export" as the text "[object Object]".
        if (!bytes) { alert('This entry\'s contents are not raw bytes — run "Repair saves" first.'); return; }
        // Export under the bare save name ("filech4_1"), not the mangled full
        // path ("savedata_filech4_1"), so re-importing the file reproduces the
        // original key instead of creating a bogus one. Leading underscores are
        // part of the name (displayName already stripped the path).
        var name = displayName(key).replace(/[\\\/:*?"<>|]/g, '_') || 'save';
        var blob = new Blob([bytes], { type: 'application/octet-stream' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
      }

      var valueCache = {};
      var renderToken = 0;   // guards the async size pass against a newer render

      function sortKeys(a, b) {
        if (sortBy === 'name') return a.localeCompare(b);
        if (sortBy === 'chapter') {
          var tagA = getChapterTag(a) || 'zzz';
          var tagB = getChapterTag(b) || 'zzz';
          if (tagA !== tagB) return tagA.localeCompare(tagB);
          return a.localeCompare(b);
        }
        return 0; // size/date handled separately
      }

      function renderAndLoad(keyList, filter) {
        savesList.innerHTML = '';
        keyList.forEach(function(key) {
          var tag = getChapterTag(key);
          var div = document.createElement('div');
          div.className = 'save-item';
          div.tabIndex = 0;
          var nameSpan = document.createElement('div');
          nameSpan.className = 'save-name';
          highlightText(nameSpan, displayName(key), filter);
          if (brokenKeys[key]) {
            // Either the key is not the full IDBFS path or the value is shaped
            // so the game's reconcile throws on it; both hide the save.
            var badTag = document.createElement('span');
            badTag.className = 'save-chapter-tag';
            badTag.textContent = 'not visible to game';
            badTag.title = brokenKeys[key] + '. Use "Repair saves" to fix it.';
            nameSpan.appendChild(badTag);
          }
          if (tag) {
            var tagSpan = document.createElement('span');
            tagSpan.className = 'save-chapter-tag';
            tagSpan.textContent = tag;
            nameSpan.appendChild(tagSpan);
          }
          if (key.endsWith('.bak')) {
            var bakTag = document.createElement('span');
            bakTag.className = 'save-chapter-tag';
            bakTag.textContent = 'backup';
            nameSpan.appendChild(bakTag);
          }
          var row2 = document.createElement('div');
          row2.className = 'save-meta';
          row2.innerHTML = '<span class="save-size-placeholder">\u2014</span>';
          var exportOne = document.createElement('button');
          exportOne.className = 'save-export-one';
          exportOne.textContent = 'Export';
          (function(k) {
            exportOne.addEventListener('click', function(e) {
              e.stopPropagation();
              loadValue(k).then(function(val) {
                if (val) saveSingleFile(k, val);
              });
            });
          })(key);
          row2.appendChild(exportOne);
          div.appendChild(nameSpan);
          div.appendChild(row2);
          (function(k) {
            div.addEventListener('click', function() {
              loadValue(k).then(function(val) {
                if (val) openEditor(k, val);
              });
            });
          })(key);
          div.addEventListener('keydown', function(e) {
            if ((e.key === 'Enter' || e.key === ' ') && !e.target.closest('button')) {
              e.preventDefault();
              div.click();
            }
          });
          savesList.appendChild(div);
        });
        // Async size pass. It is tagged with the render it belongs to: a
        // superseded pass used to write sizes into whatever rows the newer
        // render had put in those DOM positions.
        var token = ++renderToken;
        openDB().then(function(db) {
          if (token !== renderToken) { db.close(); return; }
          var tx = db.transaction(STORE, 'readonly');
          var req = tx.objectStore(STORE).openCursor();
          var els = savesList.querySelectorAll('.save-item');
          tx.onabort = tx.onerror = function() { db.close(); };
          req.onsuccess = function(e) {
            if (token !== renderToken) { db.close(); return; }
            var cursor = e.target.result;
            if (cursor) {
              var k = cursor.primaryKey;
              var v = cursor.value;
              if (v && !k.endsWith('/')) {
                valueCache[k] = v;
                var idx = keyList.indexOf(k);
                var bytes = toBytes(v.contents);
                if (idx !== -1 && els[idx]) {
                  var sizeEl = els[idx].querySelector('.save-size-placeholder');
                  if (sizeEl) sizeEl.textContent = bytes ? formatSize(bytes.length) : 'unreadable';
                }
              }
              cursor.continue();
            } else {
              db.close();
            }
          };
          req.onerror = function() { db.close(); };
        }).catch(function() {});
      }

      // Rows are rendered from raw store keys, so values must be read by the
      // same raw key. Reading through the normalising getEntry showed (and let
      // you overwrite) a different record than the row you clicked.
      function loadValue(key) {
        if (valueCache[key]) return Promise.resolve(valueCache[key]);
        return getRawEntry(key).then(function(v) { if (v) valueCache[key] = v; return v; });
      }

      function refreshList() {
        saveEditor.hidden = true;
        hexPreview.hidden = true;
        savesList.hidden = false;
        savesList.innerHTML = '<div class="saves-empty">Loading...</div>';
        var chain;
        if (sortBy === 'size' || sortBy === 'date') {
          // load full data first for comparison
          chain = listAll().then(function(items) {
            valueCache = {};
            var allFiles = items.filter(function(it) { return !isDirectory(it.value); });
            if (allFiles.length === 0) {
              savesList.innerHTML = '<div class="saves-empty">No save files found.<br><span class="saves-hint">Launch a chapter and create a save first.</span></div>';
              savesCount.textContent = '';
              return;
            }
            var filter = savesSearch.value.toLowerCase().trim();
            var filtered = allFiles;
            if (filter) filtered = allFiles.filter(function(f) { return f.key.toLowerCase().indexOf(filter) !== -1; });
            if (filtered.length === 0) {
              savesList.innerHTML = '<div class="saves-empty">No files match filter.</div>';
              savesCount.textContent = '0 / ' + allFiles.length + ' files';
              return;
            }
            filtered.sort(function(a, b) {
              if (sortBy === 'size') {
                var ba = toBytes(a.value && a.value.contents);
                var bb = toBytes(b.value && b.value.contents);
                return (bb ? bb.length : 0) - (ba ? ba.length : 0);
              }
              if (sortBy === 'date') {
                var da = a.value && a.value.timestamp ? new Date(a.value.timestamp).getTime() : 0;
                var db = b.value && b.value.timestamp ? new Date(b.value.timestamp).getTime() : 0;
                return db - da;
              }
              return a.key.localeCompare(b.key);
            });
            var keys = filtered.map(function(f) { return f.key; });
            filtered.forEach(function(f) { valueCache[f.key] = f.value; });
            savesCount.textContent = keys.length + ' / ' + allFiles.length + ' files';
            renderAndLoad(keys, filter);
          });
        } else {
          // Directories are stored WITHOUT a trailing slash and identified by
          // their mode, so this branch needs the values too — otherwise the
          // mount's subdirectories rendered as clickable, deletable "saves".
          chain = listAll().then(function(items) {
            var filter = savesSearch.value.toLowerCase().trim();
            var files = items.filter(function(it) {
              return !isDirectory(it.value) && !String(it.key).endsWith('/') && it.key !== SAVE_DIR;
            });
            files.forEach(function(f) { valueCache[f.key] = f.value; });
            if (files.length === 0) {
              savesList.innerHTML = '<div class="saves-empty">No save files found.<br><span class="saves-hint">Launch a chapter and create a save first.</span></div>';
              savesCount.textContent = '';
              return;
            }
            var keys = files.map(function(f) { return String(f.key); });
            var filtered = filter ? keys.filter(function(k) { return k.toLowerCase().indexOf(filter) !== -1; }) : keys;
            savesCount.textContent = filtered.length + ' / ' + keys.length + ' files';
            if (filtered.length === 0) {
              savesList.innerHTML = '<div class="saves-empty">No files match filter.</div>';
              return;
            }
            filtered.sort(sortKeys);
            renderAndLoad(filtered, filter);
          });
        }
        // One error handler for BOTH branches: the size/date branch used to
        // return early and leave the modal stuck on "Loading..." forever.
        return chain.catch(function(err) {
          savesList.innerHTML = '';
          var msg = document.createElement('div');
          msg.className = 'saves-empty';
          msg.textContent = 'Error loading saves: ' + (err && err.message ? err.message : err);
          savesList.appendChild(msg);
        });
      }

      // Re-scan for unreadable entries and then repaint: every mutation has to
      // go through here or the "not visible to game" tags and the repair count
      // keep describing the previous state.
      function refreshListAndFlags() {
        return updateRepairButton().then(refreshList);
      }

      function highlightText(container, text, query) {
        if (!query) { container.textContent = text; return; }
        var escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        var parts = text.split(new RegExp('(' + escaped + ')', 'gi'));
        container.innerHTML = '';
        parts.forEach(function(p) {
          if (p.toLowerCase() === query) {
            var mark = document.createElement('mark');
            mark.textContent = p;
            container.appendChild(mark);
          } else {
            container.appendChild(document.createTextNode(p));
          }
        });
      }

      function invalidateCache() { valueCache = {}; }

      var searchTimer = null;
      savesSearch.addEventListener('input', function() {
        searchClearBtn.hidden = !savesSearch.value;
        if (searchTimer) clearTimeout(searchTimer);
        searchTimer = setTimeout(refreshList, 200);
      });
      searchClearBtn.addEventListener('click', function() {
        savesSearch.value = '';
        searchClearBtn.hidden = true;
        if (searchTimer) clearTimeout(searchTimer);
        refreshList();
        savesSearch.focus();
      });
      sortSelect.addEventListener('change', function() {
        sortBy = sortSelect.value;
        refreshList();
      });

      function getChapterTag(key) {
        var name = displayName(key);
        var m = name.match(/filech([1-5])/);
        if (m) return 'Ch. ' + m[1];
        // Anchored: an unanchored indexOf('ch1') tagged "search1" as Chapter 1
        // and then sorted it under that chapter.
        m = name.match(/(?:^|[^a-z])ch(?:apter)?([1-5])(?![0-9])/i);
        return m ? 'Ch. ' + m[1] : '';
      }

      function fromHex(hex) {
        var cleaned = hex.replace(/\s+/g, '');
        // Silently dropping stray characters shifted every following byte by a
        // nibble and wrote a corrupted save with no warning.
        if (/[^0-9a-fA-F]/.test(cleaned)) throw new Error('Hex contains characters that are not 0-9 or a-f.');
        hex = cleaned;
        if (hex.length % 2) throw new Error('Hex string has an odd number of digits (' + hex.length + ').');
        var bytes = new Uint8Array(hex.length / 2);
        for (var i = 0; i < bytes.length; i++) {
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        }
        return bytes;
      }

      var hexPreview = document.getElementById('hexPreview');

      function formatHexPreview(bytes) {
        if (typeof bytes.length !== 'number' || bytes.length === 0) return '';
        var out = '', ascii = '';
        for (var i = 0; i < Math.min(256, bytes.length); i++) {
          if (i % 16 === 0) {
            if (i > 0) out += '  ' + ascii + '\n';
            ascii = '';
            out += ('00000000' + i.toString(16)).slice(-8) + ': ';
          }
          out += ('00' + (bytes[i] || 0).toString(16)).slice(-2) + ' ';
          var c = bytes[i];
          ascii += (c >= 32 && c <= 126) ? String.fromCharCode(c) : '.';
        }
        // Padding has to follow the rows actually printed, not the file size,
        // or the ASCII column of a >256-byte preview is misaligned.
        var shown = Math.min(256, bytes.length);
        var pad = 16 - (shown % 16 || 16);
        for (var j = 0; j < pad; j++) out += '   ';
        out += '  ' + ascii;
        if (bytes.length > 256) out += '\n... (' + bytes.length + ' bytes total)';
        return out;
      }

      function openEditor(key, value) {
        currentKey = key;
        currentValue = value;
        currentEncoding = 'utf-8';
        editorFilename.textContent = displayName(key);
        editorFilename.title = key;
        hexPreview.hidden = true;
        editorRestoreBackup.hidden = true;
        editorGoOriginal.hidden = true;
        if (key.endsWith('.bak')) {
          var origKey = key.slice(0, -4);
          getRawEntry(origKey).then(function(origVal) {
            editorGoOriginal.hidden = !origVal;
          }).catch(function() {});
        } else {
          getRawEntry(key + '.bak').then(function(bakVal) {
            editorRestoreBackup.hidden = !bakVal;
          }).catch(function() {});
        }
        try {
          var bytes = toBytes(value && value.contents);
          if (!bytes) {
            editorTextarea.value = '[Contents are not raw bytes — use "Repair saves" first]';
            editorTextarea.readOnly = true;
            editorSave.disabled = true;
            isHexMode = false;
          } else if (!bytes.length) {
            // An empty file is still editable: this is how a new save is filled in.
            editorTextarea.value = '';
            editorTextarea.readOnly = false;
            editorSave.disabled = false;
            isHexMode = false;
          } else {
            var decoded = decodeForEditor(bytes);
            if (decoded === null) {
              isHexMode = true;
              editorTextarea.value = toHexInline(bytes);
              hexPreview.textContent = formatHexPreview(bytes);
              hexPreview.hidden = false;
            } else {
              isHexMode = false;
              currentEncoding = decoded.encoding;
              editorTextarea.value = decoded.text;
            }
            editorTextarea.readOnly = false;
            editorSave.disabled = false;
          }
        } catch (e) {
          isHexMode = false;
          editorTextarea.value = '[Error: ' + (e && e.message ? e.message : e) + ']';
          editorTextarea.readOnly = true;
          editorSave.disabled = true;
        }
        savesList.hidden = true;
        saveEditor.hidden = false;
        editorTextarea.focus();
        isDirty = false;
        currentOriginalText = editorTextarea.value;
        // auto-save draft restoration
        try {
          var draft = sessionStorage.getItem('deltarune_draft_' + key);
          if (draft && draft !== editorTextarea.value) {
            if (confirm('Restore unsaved changes from last session for "' + displayName(key) + '"?')) {
              editorTextarea.value = draft;
              isDirty = true;
            } else {
              sessionStorage.removeItem('deltarune_draft_' + key);
            }
          }
        } catch(e) {}
      }

      function clearDraft(key) {
        if (!key) return;
        try { sessionStorage.removeItem('deltarune_draft_' + key); } catch (e) {}
      }

      function leaveEditor() {
        if (draftTimer) { clearTimeout(draftTimer); draftTimer = null; }
        // A discarded edit must not come back the next time this file (or a new
        // file reusing its name) is opened.
        if (isDirty) clearDraft(currentKey);
        isDirty = false;
      }

      var draftTimer = null;
      editorTextarea.addEventListener('input', function() {
        // "Dirty" used to mean "a key was pressed", so a no-op edit still
        // overwrote the only pristine backup on save.
        isDirty = editorTextarea.value !== currentOriginalText;
        if (draftTimer) clearTimeout(draftTimer);
        draftTimer = setTimeout(function() {
          if (currentKey && isDirty) {
            try { sessionStorage.setItem('deltarune_draft_' + currentKey, editorTextarea.value); } catch(e) {}
          }
        }, 500);
      });

      editorBack.addEventListener('click', function() {
        if (checkUnsaved()) { leaveEditor(); refreshList(); }
      });

      function sameBytes(a, b) {
        if (!a || !b || a.length !== b.length) return false;
        for (var i = 0; i < a.length; i++) { if (a[i] !== b[i]) return false; }
        return true;
      }

      editorSave.addEventListener('click', function() {
        if (!currentKey || !currentValue) return;
        var newBytes;
        try {
          newBytes = isHexMode ? fromHex(editorTextarea.value)
                               : encodeFromEditor(editorTextarea.value, currentEncoding);
        } catch (e) {
          alert('Error encoding text: ' + e.message);
          return;
        }
        var savedKey = currentKey;
        var openedBytes = toBytes(currentValue.contents);
        beginBusy();
        // Re-read first: the running game, a cloud restore or the Tenna editor
        // can have rewritten this file since it was opened, and blindly saving
        // destroyed that newer copy (the backup kept the stale bytes too).
        getRawEntry(savedKey).then(function(onDisk) {
          var current = onDisk ? toBytes(onDisk.contents) : null;
          if (onDisk && openedBytes && !sameBytes(current, openedBytes)) {
            if (!confirm('"' + displayName(savedKey) + '" changed on disk since you opened it ' +
                '(the game or a sync wrote to it).\n\nOverwrite it with your edit?')) {
              return null;
            }
          }
          var newValue = {
            contents: newBytes,
            mode: (onDisk && onDisk.mode) || currentValue.mode || FILE_MODE,
            timestamp: new Date()
          };
          var bakKey = savedKey + '.bak';
          var backupSource = onDisk || currentValue;
          // Keep the FIRST backup: overwriting it on every save meant two edits
          // were enough to lose the original for good.
          return getRawEntry(bakKey).then(function(existingBak) {
            if (existingBak || savedKey.endsWith('.bak') || !isRepairable(backupSource)) return null;
            return putEntry(bakKey, {
              contents: backupSource.contents,
              mode: backupSource.mode,
              timestamp: backupSource.timestamp
            }).catch(function() { /* a failed backup must not block the save */ });
          }).then(function() {
            return putEntry(savedKey, newValue);
          }).then(function() { return newValue; });
        }).then(function(newValue) {
          if (!newValue) return;
          editorSave.textContent = 'Saved!';
          setTimeout(function() { editorSave.textContent = 'Save Changes'; }, 1500);
          currentValue = newValue;
          isDirty = false;
          currentOriginalText = editorTextarea.value;
          clearDraft(savedKey);
          invalidateCache();
          // The preview pane showed the pre-edit bytes until the file was reopened.
          if (isHexMode) hexPreview.textContent = formatHexPreview(newValue.contents);
        }).catch(function(err) {
          alert('Error saving: ' + (err && err.message ? err.message : err));
        }).then(function() { endBusy(); });
      });

      editorDelete.addEventListener('click', function() {
        if (!currentKey) return;
        if (!checkUnsaved()) return;
        if (!confirm('Delete "' + displayName(currentKey) + '"?\nThis cannot be undone.')) return;
        var doomed = currentKey;
        deleteEntry(doomed).then(function() {
          // Otherwise the deleted file's draft is offered to the next file
          // created with the same name.
          clearDraft(doomed);
          leaveEditor();
          return refreshListAndFlags();
        }).catch(function(err) {
          alert('Error deleting: ' + (err && err.message ? err.message : err));
        });
      });

      editorRestoreBackup.addEventListener('click', function() {
        if (!currentKey || currentKey.endsWith('.bak')) return;
        if (!checkUnsaved()) return;
        var target = currentKey;
        var bakKey = target + '.bak';
        beginBusy();
        getRawEntry(bakKey).then(function(bakValue) {
          if (!bakValue) {
            editorRestoreBackup.hidden = true;
            if (window.__launcher && window.__launcher.toast) window.__launcher.toast('No backup found for this file.');
            else alert('No backup found for this file.');
            return;
          }
          // Swap, don't overwrite: restoring used to throw away the current
          // contents with no copy left anywhere.
          return getRawEntry(target).then(function(currentOnDisk) {
            var swap = Promise.resolve();
            if (currentOnDisk && isRepairable(currentOnDisk)) {
              swap = putEntry(bakKey, {
                contents: currentOnDisk.contents,
                mode: currentOnDisk.mode,
                timestamp: currentOnDisk.timestamp
              });
            }
            var newValue = {
              contents: bakValue.contents,
              mode: bakValue.mode || (currentValue && currentValue.mode) || FILE_MODE,
              timestamp: new Date()
            };
            return swap.then(function() {
              return putEntry(target, newValue);
            }).then(function() {
              invalidateCache();
              clearDraft(target);
              openEditor(target, newValue);
              if (window.__launcher && window.__launcher.toast) window.__launcher.toast('Restored from backup (previous contents kept as .bak).');
            });
          });
        }).catch(function(err) {
          alert('Error restoring from backup: ' + (err && err.message ? err.message : err));
        }).then(function() { endBusy(); });
      });

      editorGoOriginal.addEventListener('click', function() {
        if (!currentKey || !currentKey.endsWith('.bak')) return;
        if (!checkUnsaved()) return;
        var origKey = currentKey.slice(0, -4);
        getRawEntry(origKey).then(function(origValue) {
          if (!origValue) {
            editorGoOriginal.hidden = true;
            if (window.__launcher && window.__launcher.toast) window.__launcher.toast('Original file not found.');
            else alert('Original file not found.');
            return;
          }
          leaveEditor();
          openEditor(origKey, origValue);
        }).catch(function(err) {
          alert('Error opening original: ' + (err && err.message ? err.message : err));
        });
      });

      renameBtn.addEventListener('click', function() {
        if (!currentKey) return;
        if (!checkUnsaved()) return;
        var newName = prompt('New filename:', displayName(currentKey));
        if (newName === null) return;
        // Nested paths are legal in the store but not something to create from
        // here: the folder entry the game needs would not exist.
        var newKey = isValidSaveName(newName) ? normalizeKey(newName) : null;
        if (newKey === null) {
          alert('Invalid filename. Use a plain save name with no slashes.');
          return;
        }
        if (newKey === currentKey) return;
        var oldKey = currentKey;
        beginBusy();
        // Renaming onto an existing name used to overwrite that save and then
        // delete the source, destroying the destination's only copy.
        getRawEntry(newKey).then(function(clash) {
          if (clash) {
            throw new Error('"' + displayName(newKey) + '" already exists. Pick another name.');
          }
          return getRawEntry(oldKey);
        }).then(function(val) {
          if (!val) throw new Error('File not found: ' + displayName(oldKey));
          return putEntry(newKey, val).then(function() {
            return deleteEntry(oldKey);
          }).then(function() {
            invalidateCache();
            clearDraft(oldKey);
            openEditor(newKey, val);
          });
        }).catch(function(err) {
          alert('Error renaming: ' + (err && err.message ? err.message : err));
        }).then(function() { endBusy(); });
      });

      newFileBtn.addEventListener('click', function() {
        var name = prompt('New save filename:');
        if (name === null) return;
        var newKey = isValidSaveName(name) ? normalizeKey(name) : null;
        if (newKey === null) {
          alert('Invalid filename. Use a plain save name with no slashes.');
          return;
        }
        var emptyVal = { contents: new Uint8Array(0), mode: FILE_MODE, timestamp: new Date() };
        beginBusy();
        // "New File" is an upsert: without this check, typing the name of an
        // existing save replaced it with an empty file, silently and with no
        // backup.
        getRawEntry(newKey).then(function(existing) {
          if (existing) {
            throw new Error('"' + displayName(newKey) + '" already exists. Open it from the list, or pick another name.');
          }
          return putEntry(newKey, emptyVal);
        }).then(function() {
          invalidateCache();
          return refreshListAndFlags();
        }).then(function() {
          openEditor(newKey, emptyVal);
        }).catch(function(err) {
          alert('Error creating file: ' + (err && err.message ? err.message : err));
        }).then(function() { endBusy(); });
      });

      exportBtn.addEventListener('click', function() {
        listAll().then(function(items) {
          if (items.length === 0) { if (window.__launcher && window.__launcher.toast) window.__launcher.toast('Nothing to export.'); else alert('Nothing to export.'); return; }
          const out = { version: 2, db: DB_NAME, exportedAt: new Date().toISOString(), files: {} };
          var unreadable = [];
          items.forEach(function(item) {
            const v = item.value || {};
            if (isDirectory(v)) return;
            // Anything that is not convertible used to be exported as
            // contents:null and imported back as a 0-byte file — a backup that
            // silently wiped the save.
            var contents = toBytes(v.contents);
            if (!contents) { unreadable.push(displayName(item.key)); return; }
            out.files[item.key] = {
              mode: typeof v.mode === 'number' ? v.mode : FILE_MODE,
              timestamp: v.timestamp instanceof Date ? v.timestamp.toISOString() : new Date(v.timestamp || Date.now()).toISOString(),
              contents: toBase64(contents)
            };
          });
          if (!Object.keys(out.files).length) {
            alert('Nothing could be exported: every entry has unreadable contents. Run "Repair saves" first.');
            return;
          }
          const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'deltarune-saves-' + new Date().toISOString().replace(/[:.]/g, '-') + '.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
          if (unreadable.length) {
            alert('Exported ' + Object.keys(out.files).length + ' file(s).\n\nSKIPPED (unreadable contents, run "Repair saves"):\n  ' +
              unreadable.slice(0, 10).join('\n  ') + (unreadable.length > 10 ? '\n  ...' : ''));
          }
        }).catch(function(err) {
          alert('Export failed: ' + (err && err.message ? err.message : err));
        });
      });

      importBtn.addEventListener('click', function() { importInput.click(); });

      var MAX_IMPORT_BYTES = 8 * 1024 * 1024;

      // Replaces an entry but keeps the first pristine copy as <key>.bak, so an
      // import can never be the thing that loses a save.
      function putWithBackup(key, value) {
        return getRawEntry(key).then(function(existing) {
          if (!existing || key.endsWith('.bak') || !isRepairable(existing)) return null;
          return getRawEntry(key + '.bak').then(function(bak) {
            if (bak) return null;
            return putEntry(key + '.bak', existing).catch(function() {});
          });
        }).then(function() {
          return putEntry(key, value);
        });
      }

      function runImport(planned, rejected) {
        if (!planned.length) throw new Error('Nothing importable was selected.');
        var written = 0;
        var failed = [];
        var chain = Promise.resolve();
        planned.forEach(function(p) {
          chain = chain.then(function() {
            return putWithBackup(p.key, p.value).then(function() { written++; })
              .catch(function() { failed.push(displayName(p.key)); });
          });
        });
        return chain.then(function() {
          var msg = 'Imported ' + written + ' file(s).' +
            (rejected.length ? ' Skipped ' + rejected.length + ': ' + rejected.slice(0, 3).join(', ') + (rejected.length > 3 ? '…' : '') + '.' : '') +
            (failed.length ? ' ' + failed.length + ' failed.' : '');
          if (window.__launcher && window.__launcher.toast) window.__launcher.toast(msg);
          else alert(msg);
          invalidateCache();
          return refreshListAndFlags();
        });
      }

      // Plans a launcher JSON bundle. Handles every shape this project has
      // exported: version 1 with bare names, version 2 with full paths, and the
      // cloud's hex-encoded (~xx) keys.
      function planBundleImport(text) {
        var data = JSON.parse(text);
        if (!data || !data.files || typeof data.files !== 'object') {
          throw new Error('Invalid save bundle format.');
        }
        var planned = [];
        var rejected = [];
        // Decode everything before writing anything: a bad entry used to
        // reject the batch halfway, leaving a half-imported save set.
        Object.keys(data.files).forEach(function(key) {
          var decodedKey = decodeKey(key);      // no-op unless the key is hex-encoded
          var v = data.files[key];
          var label = String(decodedKey || key);
          if (decodedKey === SAVE_DIR || decodedKey === SAVE_DIR + '/') return;   // the mount itself, not a save
          var fullKey = normalizeKey(decodedKey);
          if (fullKey === null || !v || typeof v !== 'object') { rejected.push(label); return; }
          // Old exports wrote contents:null for entries whose bytes they could
          // not read. Importing that as a 0-byte file would look like a save.
          if (v.contents == null) { rejected.push(label + ' (no contents in bundle)'); return; }
          var bytes;
          try {
            bytes = fromBase64(v.contents);
          } catch (err) { rejected.push(label + ' (unreadable)'); return; }
          planned.push({ key: fullKey, value: {
            mode: typeof v.mode === 'number' ? v.mode : FILE_MODE,
            timestamp: v.timestamp ? new Date(v.timestamp) : new Date(),
            contents: bytes
          } });
        });
        return { planned: planned, rejected: rejected };
      }

      // Plans DELTARUNE's own save files, copied straight out of the game's
      // save folder (filech2_0, filech2_0.backup, dr.ini, keyconfig_0.ini …).
      // They are raw files with no wrapper, which the JSON-only importer used to
      // reject outright — the game writes them under exactly these names, so
      // each one becomes /_savedata/<filename> with its own mtime.
      function planRawImport(files) {
        var rejected = [];
        var usable = [];
        files.forEach(function(f) {
          if (f.name === '.DS_Store' || f.name === 'Thumbs.db' || f.name === 'desktop.ini') return; // OS junk
          if (normalizeKey(f.name) === null) { rejected.push(f.name); return; }
          if (f.size > MAX_IMPORT_BYTES) { rejected.push(f.name + ' (too large)'); return; }
          usable.push(f);
        });
        return Promise.all(usable.map(function(f) {
          return f.arrayBuffer().then(function(buf) {
            return { key: normalizeKey(f.name), value: {
              mode: FILE_MODE,
              // Keep the file's own mtime so the list's date column and the
              // game's reconcile see the real save time.
              timestamp: new Date(f.lastModified || Date.now()),
              contents: new Uint8Array(buf)
            } };
          });
        })).then(function(planned) {
          return { planned: planned, rejected: rejected };
        });
      }

      importInput.addEventListener('change', function(e) {
        var files = e.target.files ? Array.prototype.slice.call(e.target.files) : [];
        if (!files.length) return;
        // One .json file is a launcher bundle; anything else is the game's own
        // save files.
        var bundle = (files.length === 1 && /\.json$/i.test(files[0].name)) ? files[0] : null;
        var what = bundle ? 'the save bundle "' + bundle.name + '"'
                          : files.length + ' save file(s)';
        if (!confirm('Import ' + what + '?\n\nFiles with the same name are replaced. A .bak of each replaced file is kept.')) {
          importInput.value = '';
          return;
        }
        beginBusy();
        var plan = bundle
          ? bundle.text().then(function(text) { return planBundleImport(text); })
          : planRawImport(files);
        plan.then(function(p) {
          return runImport(p.planned, p.rejected);
        }).catch(function(err) {
          alert('Import failed: ' + (err && err.message ? err.message : err));
        }).then(function() {
          endBusy();
          importInput.value = '';
        });
      });

      // An entry is invisible to the game when its key is not the full IDBFS
      // path, or when its value is shaped so the game's reconcile throws on it.
      // Both cases mean the save is never loaded and is discarded by the next
      // syncfs; repair rewrites key and value.
      var brokenKeys = {};

      function findBrokenEntries() {
        return listAll().then(function(items) {
          var keySet = {};
          items.forEach(function(item) { keySet[String(item.key)] = item.value; });
          var broken = [];
          items.forEach(function(item) {
            var key = String(item.key);
            if (key.endsWith('/') || key === SAVE_DIR) return;
            var reason = brokenReason(key, item.value, keySet);
            if (reason) {
              var good = normalizeKey(key);
              // A nested file only needs its folder entries created — moving or
              // rewriting it would be the wrong repair.
              var missingDirs = good === key ? parentDirKeys(key).filter(function(d) { return !keySet[d]; }) : [];
              broken.push({
                key: key,
                goodKey: good,
                reason: reason,
                value: item.value,
                missingDirs: missingDirs,
                repairable: isRepairable(item.value)
              });
            }
          });
          return broken;
        });
      }

      // How much a candidate is worth keeping when two entries claim the same
      // path: real bytes beat an empty file, then the newer timestamp wins.
      function entryWeight(value) {
        var v = value || {};
        var bytes = toBytes(v.contents);
        var size = bytes ? bytes.length : (v.contents == null ? 0 : -1);
        var time = v.timestamp instanceof Date && !isNaN(v.timestamp.getTime()) ? v.timestamp.getTime() : 0;
        return { size: size, time: time };
      }

      function firstIsBetter(a, b) {
        var wa = entryWeight(a), wb = entryWeight(b);
        if ((wa.size > 0) !== (wb.size > 0)) return wa.size > 0;
        if (wa.size !== wb.size) return wa.size > wb.size;
        return wa.time >= wb.time;
      }

      function updateRepairButton() {
        return findBrokenEntries().then(function(broken) {
          brokenKeys = {};
          broken.forEach(function(b) { brokenKeys[b.key] = b.reason; });
          repairPathsBtn.hidden = broken.length === 0;
          if (broken.length) {
            repairPathsBtn.textContent = 'Repair saves (' + broken.length + ')';
          }
          return broken;
        }).catch(function() {
          repairPathsBtn.hidden = true;
          return [];
        });
      }

      repairPathsBtn.addEventListener('click', function() {
        beginBusy();
        findBrokenEntries().then(function(broken) {
          if (!broken.length) { repairPathsBtn.hidden = true; return; }
          var fixable = broken.filter(function(b) { return b.repairable && b.goodKey !== null; });
          var unfixable = broken.length - fixable.length;
          if (!fixable.length) {
            alert('None of the ' + broken.length + ' unreadable entry(ies) can be repaired automatically ' +
              'without discarding their contents, so nothing was changed. Export them and inspect them by hand.');
            return;
          }
          if (!confirm('Repair ' + fixable.length + ' save file(s)?\n\n' +
              'The game cannot read these, so it loads none of them and discards ' +
              'them the next time a chapter saves.\n\n' +
              fixable.slice(0, 10).map(function(b) {
                return '  ' + displayName(b.key) + ' — ' + b.reason;
              }).join('\n') + (fixable.length > 10 ? '\n  ...' : '') +
              (unfixable ? '\n\n' + unfixable + ' entry(ies) will be left untouched: their contents cannot be converted.' : ''))) {
            return Promise.reject({ cancelled: true });
          }
          var repaired = 0, kept = 0, failed = 0;
          var chain = Promise.resolve();
          fixable.forEach(function(entry) {
            chain = chain.then(function() {
              return getRawEntry(entry.key).then(function(val) {
                if (!val) return;
                if (entry.goodKey === entry.key) {
                  // Missing folder entries first: IDBFS creates directories
                  // before the files inside them, and a file whose folder entry
                  // is absent makes the whole sync fail with ENOENT.
                  var dirs = Promise.resolve();
                  (entry.missingDirs || []).forEach(function(dirKey) {
                    dirs = dirs.then(function() {
                      return putEntry(dirKey, { mode: 16877, timestamp: val.timestamp instanceof Date ? val.timestamp : new Date() });
                    });
                  });
                  return dirs.then(function() {
                    return putEntry(entry.key, val);
                  }).then(function() { repaired++; });
                }
                return getRawEntry(entry.goodKey).then(function(existing) {
                  if (!existing) {
                    return putEntry(entry.goodKey, val).then(function() {
                      repaired++;
                      return deleteEntry(entry.key);
                    });
                  }
                  // Both paths hold data. Deleting the loser used to throw away
                  // a full save because a 0-byte file happened to sit at the
                  // good path, so the loser is parked as .stray instead.
                  if (firstIsBetter(val, existing)) {
                    return putEntry(entry.goodKey + '.stray', existing).then(function() {
                      return putEntry(entry.goodKey, val);
                    }).then(function() {
                      repaired++;
                      return deleteEntry(entry.key);
                    });
                  }
