                  return putEntry(entry.goodKey + '.stray', val).then(function() {
                    kept++;
                    return deleteEntry(entry.key);
                  });
                });
              }).catch(function() { failed++; });
            });
          });
          return chain.then(function() {
            invalidateCache();
            return refreshListAndFlags();
          }).then(function() {
            var msg = 'Repaired ' + repaired + ' save file(s)' +
              (kept ? ', parked ' + kept + ' older duplicate(s) as .stray' : '') +
              (unfixable ? ', left ' + unfixable + ' unconvertible entry(ies) untouched' : '') +
              (failed ? ', ' + failed + ' failed' : '') + '.';
            if (window.__launcher && window.__launcher.toast) window.__launcher.toast(msg);
            else alert(msg);
          });
        }).catch(function(err) {
          if (err && err.cancelled) return;
          alert('Repair failed: ' + (err && err.message ? err.message : err));
        }).then(function() { endBusy(); });
      });

      clearBackupsBtn.addEventListener('click', function() {
        beginBusy();
        listAll().then(function(items) {
          var keys = {};
          items.forEach(function(item) { keys[String(item.key)] = true; });
          var bakItems = items.filter(function(item) { return String(item.key).endsWith('.bak'); });
          if (bakItems.length === 0) {
            if (window.__launcher && window.__launcher.toast) window.__launcher.toast('No backup files to clear.');
            else alert('No backup files to clear.');
            return;
          }
          // A .bak whose original is gone (deleted, renamed) is the last copy
          // of that save — clearing it would be the actual data loss.
          var orphans = bakItems.filter(function(item) { return !keys[String(item.key).slice(0, -4)]; });
          var deletable = bakItems.filter(function(item) { return keys[String(item.key).slice(0, -4)]; });
          if (!deletable.length) {
            alert('The only backups left have no original file, so they are the last copy of those saves. Nothing was deleted.');
            return;
          }
          if (!confirm('Delete ' + deletable.length + ' backup file(s)?\nThis cannot be undone.' +
              (orphans.length ? '\n\n' + orphans.length + ' backup(s) whose original is gone will be KEPT.' : ''))) return;
          var promises = deletable.map(function(item) { return deleteEntry(item.key); });
          return Promise.all(promises).then(function() {
            var msg = 'Deleted ' + deletable.length + ' backup file(s).' +
              (orphans.length ? ' Kept ' + orphans.length + ' with no original.' : '');
            if (window.__launcher && window.__launcher.toast) window.__launcher.toast(msg);
            else alert(msg);
            invalidateCache();
            return refreshListAndFlags();
          });
        }).catch(function(err) {
          alert('Error clearing backups: ' + (err && err.message ? err.message : err));
        }).then(function() { endBusy(); });
      });

      var tennaWindow = null;
      var tennaSession = null;   // { win, key } for the editor that is open now

      function openTennaEditor(key, value) {
        var bytes = toBytes(value && value.contents);
        if (!bytes) { alert('Select a save file with readable contents first.'); return; }
        if (tennaWindow && !tennaWindow.closed) { tennaWindow.close(); }

          // Confirm only now that the file count is known: "this will overwrite
          // the cloud backup" gave no way to notice a near-empty upload.
          var q = 'Replace the cloud backup for "' + cloudId + '" with ' + fileCount + ' save file(s) (~' + formatSize(estPayload) + ')?';
          if (data.unreadable) q += '\n' + data.unreadable + ' local entry(ies) have unreadable contents and are left out.';
          if (estPayload > 10 * 1024 * 1024) q += '\nWarning: that is a large upload.';
          q += '\n\nThe cloud copy is replaced entirely. Local files are not touched.';
          if (!confirm(q)) return Promise.reject({ cancelled: true });
          data.uploadedAt = new Date().toISOString();
          return firebaseRetry(function() { return withTimeout(rtdb.ref(path).set(data), 'Upload'); });
        }).then(function() {
          cloudNotify('Uploaded ' + fileCount + ' save file(s) to the cloud.');
          try { localStorage.setItem(LAST_UPLOAD_KEY, new Date().toISOString()); } catch(e) {}
          updateSyncStatus();
        }).catch(function(err) {
          if (err && err.cancelled) return; // User cancelled — finally still runs
          cloudNotify('Upload failed: ' + (err && err.message ? err.message : err));
        }).finally(function() {
          endCloudOp();
        });
      });

      downloadBtn.addEventListener('click', function() {
        if (isBusy()) { cloudNotify('A save operation is already running — try again in a moment.'); return; }
        var path = getCloudPath();
        if (!path) { cloudNotify(cloudIdError()); return; }
        var cloudData = null;
        var wrote = false;
        beginBusy();
        setCloudButtonsEnabled(false);
        downloadBtn.textContent = '\u231b Checking...';
        withTimeout(initFirebase(), 'Firebase init').then(function() {
          if (!rtdb) { throw new Error('Firebase not initialized.'); }
          return firebaseRetry(function() { return withTimeout(rtdb.ref(path).once('value'), 'Download'); });
        }).then(function(snapshot) {
          cloudData = snapshot && snapshot.val ? snapshot.val() : null;
          if (!cloudData || !cloudData.files) {
            return Promise.reject({ noData: true });
          }
          // Compute diff preview
          return listAll();
        }).then(function(localItems) {
          var plan = planCloudImport(cloudData.files, localItems);
          var msg = 'Cloud has ' + plan.total + ' entry(ies): ' + describePlan(plan) + '.';
          if (plan.updated) msg += '\nEach replaced file is backed up to <name>.bak first.';
          if (plan.created + plan.updated === 0) {
            // Nothing would be written; don't report a download that did nothing.
            return Promise.reject({ nothing: true, msg: msg });
          }
          if (!confirm('Download summary:\n' + msg + '\n\nContinue with download?')) {
            return Promise.reject({ cancelled: true });
          }
          downloadBtn.textContent = '\u231b Downloading...';
          wrote = true;
          return importSavesFromObject(cloudData);
        }).then(function(result) {
          var msg = 'Downloaded from cloud: ' + result.created + ' new, ' + result.overwritten + ' replaced';
          if (result.older) msg += ', ' + result.older + ' kept (local copy is newer)';
          if (result.skipped) msg += ', ' + result.skipped + ' skipped';
          if (result.rejected) msg += ', ' + result.rejected + ' rejected (unusable name)';
          if (result.oversized) msg += ', ' + result.oversized + ' skipped (too large)';
          if (result.unusable) msg += ', ' + result.unusable + ' skipped (unreadable contents)';
          if (result.corrupt) msg += ', ' + result.corrupt + ' NOT written (hash mismatch)';
          if (result.unverified) msg += ', ' + result.unverified + ' unverified (integrity check unavailable)';
          if (result.failed) msg += ', ' + result.failed + ' failed to write';
          msg += '.';
          cloudNotify(msg);
          try { localStorage.setItem(LAST_DOWNLOAD_KEY, new Date().toISOString()); } catch(e) {}
          updateSyncStatus();
        }).catch(function(err) {
          if (err && err.cancelled) return; // User cancelled
          if (err && err.noData) { cloudNotify('No cloud saves found for this ID.'); return; }
          if (err && err.nothing) { cloudNotify('Nothing to download. ' + err.msg); return; }
          cloudNotify('Download failed: ' + (err && err.message ? err.message : err));
        }).finally(function() {
          endCloudOp();
          // The refresh used to sit on the success path only, so a download that
          // failed part-way left the list describing the pre-download files.
          if (wrote) {
            invalidateCache();
            refreshListAndFlags();
          }
        });
      });

      savesBtn.addEventListener('click', openModal);
      closeSavesBtn.addEventListener('click', closeModal);
      savesModal.addEventListener('click', function(e) {
        if (e.target === savesModal) closeModal();
      });
      document.addEventListener('keydown', function(e) {
        if (savesModal.hidden || e.key !== 'Escape') return;
        // Only swallow Escape when the modal actually closed: closeModal() bails
        // out while an operation is running or with unsaved edits, and stopping
        // propagation first meant Escape did nothing at all in those states.
        if (closeModal()) e.stopPropagation();
      }, true); // capture phase so it runs before launcher's keydown

      // Modal focus trap
      savesModal.addEventListener('keydown', function(e) {
        if (e.key !== 'Tab') return;
        var candidates = savesModal.querySelectorAll('button, input, textarea, select, [tabindex]:not([tabindex="-1"])');
        // A disabled or hidden control cannot take focus: including them (the
        // hidden editor panel, the cloud buttons while an op runs) made Tab land
        // nowhere and the trap stop cycling.
        var focusable = [];
        for (var i = 0; i < candidates.length; i++) {
          var el = candidates[i];
          if (el.disabled || el.hidden || el.closest('[hidden]')) continue;
          if (el.getClientRects().length === 0) continue;
          focusable.push(el);
        }
        if (focusable.length === 0) return;
        var first = focusable[0], last = focusable[focusable.length - 1];
        if (e.shiftKey) {
          if (document.activeElement === first) { e.preventDefault(); last.focus(); }
        } else {
          if (document.activeElement === last) { e.preventDefault(); first.focus(); }
        }
      });

      // Global keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (!savesModal.hidden && (e.ctrlKey || e.metaKey)) {
          if (e.key === 's') {
            e.preventDefault();
            if (!saveEditor.hidden && !editorSave.disabled) editorSave.click();
          } else if (e.key === 'e') {
            e.preventDefault();
            if (currentKey && currentValue) saveSingleFile(currentKey, currentValue);
          } else if (e.key === 'f') {
            e.preventDefault();
            savesSearch.focus();
            savesSearch.select();
          }
        }
      });
    })();
  </script>
</body>
</html>
